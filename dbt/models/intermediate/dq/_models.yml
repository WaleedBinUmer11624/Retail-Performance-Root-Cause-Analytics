      - dq_rule:
          name: dq_FI_08
          description: "FI-08: Stock fields in range (no negatives other than adjustments)"
          arguments:
            rule_id: FI-08
            failed: 0
            checked: 939249
            condition: "fi_08_fail"
          config:
            tags: [dq, FI-08]
            meta: {rule_id: FI-08}
      - dq_rule:
          name: dq_FI_09
          description: "FI-09: Snapshot is a Sunday and matches the retail week"
