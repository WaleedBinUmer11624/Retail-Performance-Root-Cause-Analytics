version: 2

# Phase 3 data-quality stages, ported to SQL in Phase 3 order, with the Phase 3 data-quality rules that run on them as generic tests.
# Generated by dbt/scripts/generate_dq_rule_tests.py; do not edit by hand. Every failed / checked number
# is Phase 3's own result in reports/phase3/dq_rule_results.csv; tests/test_dbt_project.py fails if they
# ever differ.
models:
  - name: int_dq__dim_date
    description: "dim_date typed to its contract; carries the DD-02 flag (dimensions.clean_dim_date)."
    data_tests:
      - dq_rule:
          name: dq_DD_02
          description: "DD-02: Derived attributes agree with the date (weekday, weekend, retail week)"
          arguments:
            rule_id: DD-02
            failed: 0
            checked: 731
            condition: "dd_02_fail"
          config:
            tags: [dq, DD-02]
            meta: {rule_id: DD-02}

  - name: int_dq__dim_store
    description: "dim_store after DS-02 (trim) and DS-03 (canonical region and format), with the DS rule flags."
    data_tests:
      - dq_rule:
          name: dq_DS_03
          description: "DS-03: region, store_format in the canonical domain"
          arguments:
            rule_id: DS-03
            failed: 1
            checked: 20
            condition: "ds_03_fail"
          config:
            tags: [dq, DS-03]
            meta: {rule_id: DS-03}

  - name: int_dq__till_reference
    description: "Modal unit price and cost per SKU and year on the POS lines as received (dimensions.till_reference)."

  - name: int_dq__category_map
    description: "Canonical category for every product-master and POS category label (dimensions.canonical_category)."

  - name: int_dq__dim_product
    description: "dim_product through DP-01 to DP-08: one row per raw record, is_kept marks the curated rows."
    data_tests:
      - dq_rule:
          name: dq_DP_01
          description: "DP-01: product_id unique"
          arguments:
            rule_id: DP-01
            failed: 10
            checked: 610
            condition: "dp_01_fail"
          config:
            tags: [dq, DP-01]
            meta: {rule_id: DP-01}
      - dq_rule:
          name: dq_DP_02
          description: "DP-02: category is one of the 7 canonical categories"
          arguments:
            rule_id: DP-02
            failed: 12
            checked: 600
            population: "is_kept"
            condition: "dp_02_fail"
          config:
            tags: [dq, DP-02]
            meta: {rule_id: DP-02}
      - dq_rule:
          name: dq_DP_03
          description: "DP-03: Text fields without leading or trailing spaces"
          arguments:
            rule_id: DP-03
            failed: 2
            checked: 600
            population: "is_kept"
            condition: "dp_03_fail"
          config:
            tags: [dq, DP-03]
            meta: {rule_id: DP-03}
      - dq_rule:
          name: dq_DP_04
          description: "DP-04: supplier_id and supplier_name present"
          arguments:
            rule_id: DP-04
            failed: 5
            checked: 600
            population: "is_kept"
            condition: "dp_04_fail"
          config:
            tags: [dq, DP-04]
            meta: {rule_id: DP-04}
      - dq_rule:
          name: dq_DP_06
          description: "DP-06: unit_cost below list_price"
          arguments:
            rule_id: DP-06
            failed: 0
            checked: 600
            population: "is_kept"
            condition: "dp_06_fail"
          config:
            tags: [dq, DP-06]
            meta: {rule_id: DP-06}
      - dq_rule:
          name: dq_DP_07
          description: "DP-07: Launch/discontinuation dates and status consistent"
          arguments:
            rule_id: DP-07
            failed: 0
            checked: 600
            population: "is_kept"
            condition: "dp_07_fail"
          config:
            tags: [dq, DP-07]
            meta: {rule_id: DP-07}
      - dq_rule:
          name: dq_DP_08
          description: "DP-08: product_name unique across product IDs"
          arguments:
            rule_id: DP-08
            failed: 36
            checked: 600
            population: "is_kept"
            condition: "dp_08_fail"
          config:
            tags: [dq, DP-08]
            meta: {rule_id: DP-08}

  - name: int_dq__promotions
    description: "fact_promotions through FP-01, FP-02 and FP-04; stage marks curated rows and quarantined ones."
    data_tests:
      - dq_rule:
          name: dq_FP_02
          description: "FP-02: end_date on or after start_date"
          arguments:
            rule_id: FP-02
            failed: 2
            checked: 49430
            population: "stage <> 'fp_01'"
            condition: "fp_02_fail"
          config:
            tags: [dq, FP-02]
            meta: {rule_id: FP-02}
      - dq_rule:
          name: dq_FP_04
          description: "FP-04: product_id and store_id exist in the dimensions"
          arguments:
            rule_id: FP-04
            failed: 3
            checked: 49430
            population: "stage in ('kept', 'fp_04')"
            condition: "fp_04_fail"
          config:
            tags: [dq, FP-04]
            meta: {rule_id: FP-04}
      - dq_rule:
          name: dq_FP_05
          description: "FP-05: discount_pct between 0 and the maximum discount share"
          arguments:
            rule_id: FP-05
            failed: 0
            checked: 49427
            population: "stage = 'kept'"
            condition: "coalesce(not (discount_pct between 0.0001 and {{ var('max_discount_share') }}), true) or coalesce(promotion_type not in {{ in_list(var('promotion_types')) }}, true)"
          config:
            tags: [dq, FP-05]
            meta: {rule_id: FP-05}
      - dq_rule:
          name: dq_FP_06
          description: "FP-06: Promotion window inside the extract period"
          arguments:
            rule_id: FP-06
            failed: 797
            checked: 49427
            population: "stage = 'kept'"
            condition: "coalesce(end_date > date '{{ var(\"period_end\") }}', false)"
          config:
            tags: [dq, FP-06]
            meta: {rule_id: FP-06}

  - name: int_dq__promotions_restored
    description: "FP-04 promotion rows moved back into the curated table because POS lines identify their product (run_dq.restore_promotions)."

  - name: int_dq__sales_received
    description: "Every POS line received (main extract plus late file) with the TC-01 lag and the FS-01 duplicate flag."
    data_tests:
      - dq_rule:
          name: dq_FS_01
          description: "FS-01: transaction_id + line_number unique"
          arguments:
            rule_id: FS-01
            failed: 1965
            checked: 1341515
            condition: "fs_01_fail"
          config:
            tags: [dq, FS-01]
            meta: {rule_id: FS-01}
      - dq_rule:
          name: dq_TC_01
          description: "TC-01: Sales batches arrive within the expected lag"
          arguments:
            rule_id: TC-01
            failed: 2270
            checked: 1341515
            condition: "tc_01_fail"
          config:
            tags: [dq, TC-01]
            meta: {rule_id: TC-01}

  - name: int_dq__sales_deduplicated
    description: "One copy of each POS line, with the date, store and sign treatments (FS-02, 03, 04, 08, 12) and the FS-09 flag."
    data_tests:
      - dq_rule:
          name: dq_FS_02
          description: "FS-02: transaction_date in ISO format (yyyy-mm-dd)"
          arguments:
            rule_id: FS-02
            failed: 2966
            checked: 1339550
            condition: "fs_02_fail"
          config:
            tags: [dq, FS-02]
            meta: {rule_id: FS-02}
      - dq_rule:
          name: dq_FS_03
          description: "FS-03: transaction_date present, valid, in period and equal to the ID date"
          arguments:
            rule_id: FS-03
            failed: 201
            checked: 1339550
            condition: "fs_03_fail"
          config:
            tags: [dq, FS-03]
            meta: {rule_id: FS-03}
      - dq_rule:
          name: dq_FS_04
          description: "FS-04: store_id present, known and equal to the ID store"
          arguments:
            rule_id: FS-04
            failed: 803
            checked: 1339550
            condition: "fs_04_fail"
          config:
            tags: [dq, FS-04]
            meta: {rule_id: FS-04}
      - dq_rule:
          name: dq_FS_08
          description: "FS-08: quantity positive (whole line sign-inverted)"
          arguments:
            rule_id: FS-08
            failed: 535
            checked: 1339550
            condition: "fs_08_fail"
          config:
            tags: [dq, FS-08]
            meta: {rule_id: FS-08}
      - dq_rule:
          name: dq_FS_09
          description: "FS-09: quantity at or below the plausible maximum for a store line"
          arguments:
            rule_id: FS-09
            failed: 40
            checked: 1339550
            condition: "fs_09_fail"
          config:
            tags: [dq, FS-09]
            meta: {rule_id: FS-09}
      - dq_rule:
          name: dq_FS_12
          description: "FS-12: unit_price not negative (money fields sign-inverted)"
          arguments:
            rule_id: FS-12
            failed: 67
            checked: 1339550
            condition: "fs_12_fail"
          config:
            tags: [dq, FS-12]
            meta: {rule_id: FS-12}

  - name: int_dq__sales_scoped
    description: "POS lines in scope, with the product and price treatments (FS-05, 06, 10, 11, 13, 15) and the FS-14 and FS-28 checks."
    data_tests:
      - dq_rule:
          name: dq_FS_05
          description: "FS-05: product_id present"
          arguments:
            rule_id: FS-05
            failed: 1070
            checked: 1339510
            condition: "fs_05_fail"
          config:
            tags: [dq, FS-05]
            meta: {rule_id: FS-05}
      - dq_rule:
          name: dq_FS_06
          description: "FS-06: product_id exists in dim_product"
          arguments:
            rule_id: FS-06
            failed: 267
            checked: 1339510
            condition: "fs_06_fail"
          config:
            tags: [dq, FS-06]
            meta: {rule_id: FS-06}
      - dq_rule:
          name: dq_FS_10
          description: "FS-10: unit_price present"
          arguments:
            rule_id: FS-10
            failed: 401
            checked: 1339510
            condition: "fs_10_fail"
          config:
            tags: [dq, FS-10]
            meta: {rule_id: FS-10}
      - dq_rule:
          name: dq_FS_11
          description: "FS-11: unit_price above zero"
          arguments:
            rule_id: FS-11
            failed: 134
            checked: 1339510
            condition: "fs_11_fail"
          config:
            tags: [dq, FS-11]
            meta: {rule_id: FS-11}
      - dq_rule:
          name: dq_FS_13
          description: "FS-13: unit_price not about 100x the SKU reference price"
          arguments:
            rule_id: FS-13
            failed: 134
            checked: 1339510
            condition: "fs_13_fail"
          config:
            tags: [dq, FS-13]
            meta: {rule_id: FS-13}
      - dq_rule:
          name: dq_FS_14
          description: "FS-14: unit_price within 1% of the SKU-year reference price"
          arguments:
            rule_id: FS-14
            failed: 0
            checked: 1339510
            population: "not fs_11_quarantined"
            condition: "fs_14_fail"
          config:
            tags: [dq, FS-14]
            meta: {rule_id: FS-14}
      - dq_rule:
          name: dq_FS_15
          description: "FS-15: discount present"
          arguments:
            rule_id: FS-15
            failed: 1337
            checked: 1339510
            condition: "fs_15_fail"
          config:
            tags: [dq, FS-15]
            meta: {rule_id: FS-15}
      - dq_rule:
          name: dq_FS_17
          description: "FS-17: revenue = quantity x unit_price - discount"
          arguments:
            rule_id: FS-17
            failed: 535
            checked: 1339510
            population: "not fs_11_quarantined"
            condition: "row_key in (select row_key from {{ ref('int_dq__sales_curated') }} where fs_17_fail)"
          config:
            tags: [dq, FS-17]
            meta: {rule_id: FS-17}
      - dq_rule:
          name: dq_FS_28
          description: "FS-28: Line price check impossible (UNKNOWN product, no reference price)"
          arguments:
            rule_id: FS-28
            failed: 1293
            checked: 1339510
            population: "not fs_11_quarantined"
            condition: "fs_28_fail"
          config:
            tags: [dq, FS-28]
            meta: {rule_id: FS-28}

  - name: int_dq__sales_curated
    description: "Final POS stage (FS-07, FS-16 to FS-27) and the curated sales columns with each line's dq_status and dq_rules; equals data/processed/curated/fact_sales.csv."
    data_tests:
      - dq_rule:
          name: dq_FS_07
          description: "FS-07: POS category label equals the product master category"
          arguments:
            rule_id: FS-07
            failed: 20059
            checked: 1339510
            condition: "fs_07_fail"
          config:
            tags: [dq, FS-07]
            meta: {rule_id: FS-07}
      - dq_rule:
          name: dq_FS_16
          description: "FS-16: discount between 0 and the maximum discount share of gross"
          arguments:
            rule_id: FS-16
            failed: 0
            checked: 1339510
            condition: "fs_16_fail"
          config:
            tags: [dq, FS-16]
            meta: {rule_id: FS-16}
      - dq_rule:
          name: dq_FS_18
          description: "FS-18: margin = revenue - cost and cost = quantity x unit_cost"
          arguments:
            rule_id: FS-18
            failed: 0
            checked: 1339510
            condition: "fs_18_fail"
          config:
            tags: [dq, FS-18]
            meta: {rule_id: FS-18}
      - dq_rule:
          name: dq_FS_19
          description: "FS-19: promotion_id exists in fact_promotions"
          arguments:
            rule_id: FS-19
            failed: 267
            checked: 261724
            population: "promo_present"
            condition: "fs_19_fail"
          config:
            tags: [dq, FS-19]
            meta: {rule_id: FS-19}
      - dq_rule:
          name: dq_FS_20
          description: "FS-20: Promoted line's store and product are in that promotion"
          arguments:
            rule_id: FS-20
            failed: 0
            checked: 261515
            population: "promo_known"
            condition: "fs_20_fail"
          config:
            tags: [dq, FS-20]
            meta: {rule_id: FS-20}
      - dq_rule:
          name: dq_FS_21
          description: "FS-21: Promoted line carries a discount"
          arguments:
            rule_id: FS-21
            failed: 0
            checked: 261515
            population: "promo_known"
            condition: "fs_21_fail"
          config:
            tags: [dq, FS-21]
            meta: {rule_id: FS-21}
      - dq_rule:
          name: dq_FS_22
          description: "FS-22: Promoted line falls within the promotion dates"
          arguments:
            rule_id: FS-22
            failed: 0
            checked: 261515
            population: "promo_known"
            condition: "fs_22_fail"
          config:
            tags: [dq, FS-22]
            meta: {rule_id: FS-22}
      - dq_rule:
          name: dq_FS_23
          description: "FS-23: Discount without a promotion_id (non-promotional markdown)"
          arguments:
            rule_id: FS-23
            failed: 16079
            checked: 1339510
            condition: "fs_23_fail"
          config:
