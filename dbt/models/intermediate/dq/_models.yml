            meta: {rule_id: FS-25}
      - dq_rule:
          name: dq_FS_27
          description: "FS-27: No sales before launch or more than a week after discontinuation"
          arguments:
            rule_id: FS-27
            failed: 0
            checked: 1339510
            condition: "fs_27_fail"
          config:
            tags: [dq, FS-27]
            meta: {rule_id: FS-27}

  - name: int_dq__returns
    description: "fact_returns through FR-02 to FR-12, linked to the sale lines received and to the curated sale lines."
    data_tests:
      - dq_rule:
          name: dq_FR_02
          description: "FR-02: return_id unique"
          arguments:
            rule_id: FR-02
            failed: 0
            checked: 34664
            condition: "fr_02_fail"
          config:
            tags: [dq, FR-02]
            meta: {rule_id: FR-02}
      - dq_rule:
          name: dq_FR_03
          description: "FR-03: Return linked to an original sale"
          arguments:
            rule_id: FR-03
            failed: 1049
            checked: 34664
            population: "not fr_02_fail"
            condition: "fr_03_fail"
          config:
            tags: [dq, FR-03]
            meta: {rule_id: FR-03}
      - dq_rule:
          name: dq_FR_04
          description: "FR-04: Linked sale line exists"
          arguments:
            rule_id: FR-04
            failed: 144
            checked: 33615
            population: "not fr_02_fail and has_receipt"
            condition: "fr_04_fail"
          config:
            tags: [dq, FR-04]
            meta: {rule_id: FR-04}
      - dq_rule:
          name: dq_FR_05
          description: "FR-05: Return date after the sale date"
          arguments:
            rule_id: FR-05
            failed: 35
            checked: 33470
            population: "is_linked_curated"
            condition: "fr_05_fail"
          config:
            tags: [dq, FR-05]
            meta: {rule_id: FR-05}
      - dq_rule:
          name: dq_FR_06
          description: "FR-06: Returned quantity not above the quantity sold"
          arguments:
            rule_id: FR-06
            failed: 67
            checked: 33470
            population: "is_linked_curated"
            condition: "fr_06_fail"
          config:
            tags: [dq, FR-06]
            meta: {rule_id: FR-06}
      - dq_rule:
          name: dq_FR_07
          description: "FR-07: Refund not above the sale line value for the units returned"
          arguments:
            rule_id: FR-07
            failed: 0
            checked: 33470
            population: "is_linked_curated"
            condition: "fr_07_fail"
          config:
            tags: [dq, FR-07]
            meta: {rule_id: FR-07}
      - dq_rule:
          name: dq_FR_08
