            condition: "fr_09_fail"
          config:
            tags: [dq, FR-09]
            meta: {rule_id: FR-09}
      - dq_rule:
          name: dq_FR_10
          description: "FR-10: Return within the returns policy window"
          arguments:
            rule_id: FR-10
            failed: 0
            checked: 33470
            population: "is_linked_curated"
            condition: "fr_10_fail"
          config:
            tags: [dq, FR-10]
            meta: {rule_id: FR-10}
      - dq_rule:
          name: dq_FR_11
