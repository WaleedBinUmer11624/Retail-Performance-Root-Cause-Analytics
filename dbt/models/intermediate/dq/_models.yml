            condition: "fi_09_fail"
          config:
            tags: [dq, FI-09]
            meta: {rule_id: FI-09}
      - dq_rule:
          name: dq_FI_10
          description: "FI-10: store_id and product_id exist in the dimensions"
          arguments:
            rule_id: FI-10
            failed: 0
            checked: 939249
            condition: "fi_10_fail"
          config:
            tags: [dq, FI-10]
            meta: {rule_id: FI-10}

  - name: int_dq__targets
    description: "fact_targets through FT-01 to FT-04; stage marks superseded and quarantined targets."
    data_tests:
