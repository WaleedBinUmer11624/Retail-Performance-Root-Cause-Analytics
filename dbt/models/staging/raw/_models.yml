version: 2

# Raw extracts (Phase 3 inputs), with the Phase 3 data-quality rules that run on them as generic tests.
# Generated by dbt/scripts/generate_dq_rule_tests.py; do not edit by hand. Every failed / checked number
# is Phase 3's own result in reports/phase3/dq_rule_results.csv; tests/test_dbt_project.py fails if they
# ever differ.
models:
  - name: stg_raw__dim_store
    description: "Raw extract data/raw/dim_store.csv as delivered (Phase 3 input), every column text, with source_file and source_row (CSV line number)."
    data_tests:
      - dq_unique_well_formed:
          name: dq_DS_01
          description: "DS-01: store_id unique and well formed"
          arguments:
            rule_id: DS-01
            failed: 0
            checked: 20
            column: "store_id"
            pattern: "^S\\d{2}$"
          config:
            tags: [dq, DS-01]
            meta: {rule_id: DS-01}
      - dq_padded:
          name: dq_DS_02
          description: "DS-02: Text fields without leading or trailing spaces"
          arguments:
            rule_id: DS-02
            failed: 1
            checked: 20
            columns: [store_id, store_name, town, county, region, store_format, manager_name]
            key: "store_id"
          config:
            tags: [dq, DS-02]
            meta: {rule_id: DS-02}
      - dq_rule:
          name: dq_DS_04
          description: "DS-04: Numeric attributes plausible (area, FTE, hours, coordinates in Ireland)"
          arguments:
            rule_id: DS-04
            failed: 0
            checked: 20
            key: "store_id"
            condition: "coalesce({{ to_num('floor_area_m2') }} <= 0, false) or coalesce({{ to_num('headcount_fte') }} <= 0, false) or coalesce(not ({{ to_num('weekly_trading_hours') }} between 40 and 168), true) or coalesce(not ({{ to_num('latitude') }} between 51.3 and 55.5), true) or coalesce(not ({{ to_num('longitude') }} between -10.7 and -5.9), true)"
          config:
            tags: [dq, DS-04]
            meta: {rule_id: DS-04}

  - name: stg_raw__dim_product
    description: "Raw extract data/raw/dim_product.csv as delivered (Phase 3 input), every column text, with source_file and source_row (CSV line number)."

  - name: stg_raw__dim_date
    description: "Raw extract data/raw/dim_date.csv as delivered (Phase 3 input), every column text, with source_file and source_row (CSV line number)."

  - name: stg_raw__fact_sales
    description: "Raw extract data/raw/fact_sales.csv as delivered (Phase 3 input), every column text, with source_file and source_row (CSV line number)."

  - name: stg_raw__fact_sales_late_batch
    description: "Raw extract data/raw/fact_sales_late_batch.csv as delivered (Phase 3 input), every column text, with source_file and source_row (CSV line number)."

  - name: stg_raw__fact_inventory
    description: "Raw extract data/raw/fact_inventory.csv as delivered (Phase 3 input), every column text, with source_file and source_row (CSV line number)."
    data_tests:
      - dq_exact_duplicates:
          name: dq_FI_01
          description: "FI-01: No exact duplicate rows"
          arguments:
            rule_id: FI-01
            failed: 188
            checked: 939437
            key: "store_id || '|' || product_id || '|' || snapshot_date"
            columns: [snapshot_date, retail_year, retail_week, store_id, product_id, opening_stock, received_qty, sold_qty, adjustment_qty, closing_stock]
          config:
            tags: [dq, FI-01]
            meta: {rule_id: FI-01}

  - name: stg_raw__fact_returns
    description: "Raw extract data/raw/fact_returns.csv as delivered (Phase 3 input), every column text, with source_file and source_row (CSV line number)."
    data_tests:
      - dq_exact_duplicates:
          name: dq_FR_01
          description: "FR-01: No exact duplicate rows"
          arguments:
            rule_id: FR-01
            failed: 69
            checked: 34733
            key: "return_id"
            columns: [return_id, return_date, store_id, original_transaction_id, original_line_number, product_id, return_quantity, refund_value, return_reason, restockable_flag]
          config:
            tags: [dq, FR-01]
            meta: {rule_id: FR-01}

  - name: stg_raw__fact_promotions
    description: "Raw extract data/raw/fact_promotions.csv as delivered (Phase 3 input), every column text, with source_file and source_row (CSV line number)."
    data_tests:
      - dq_exact_duplicates:
          name: dq_FP_01
          description: "FP-01: No exact duplicate rows"
          arguments:
            rule_id: FP-01
            failed: 4
            checked: 49434
            key: "promotion_id || '|' || product_id || '|' || store_id"
            columns: [promotion_id, promotion_name, promotion_type, product_id, store_id, start_date, end_date, discount_pct]
          config:
            tags: [dq, FP-01]
            meta: {rule_id: FP-01}

  - name: stg_raw__fact_targets
    description: "Raw extract data/raw/fact_targets.csv as delivered (Phase 3 input), every column text, with source_file and source_row (CSV line number)."
