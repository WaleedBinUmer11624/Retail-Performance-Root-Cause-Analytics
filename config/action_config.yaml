# ----------------------------------------------------------------------------- action register
# category: ACT NOW | INVESTIGATE FIRST | MONITOR | NO ACTION YET
# type: Control (low-risk operational control) | Governance control | Evidence capture | Investigation |
#       Monitoring | Hold (a deliberate decision not to act yet) | Analysis
# An ACT NOW action must be reversible (High) and low effort, and either rest on Root-cause evidence or be an
# evidence-capture or governance control that is sensible whatever the cause (tested).
actions:
  - {id: A01, issue: I1, category: INVESTIGATE FIRST, type: Investigation, window: "0-30", effort: Low, reversibility: High,
     action: "Confirm the receipt loss is real: reconcile S03 to S05 till receipt counts with card-terminal settlement counts and store banking from January 2025.",
     why: "Rules out a data-capture explanation cheaply before anyone spends money on a commercial response.",
     owner: Data/BI, supporting: Finance; Store managers, kpi: Receipts per store-day vs settlement count, trigger: "Any store-day where counts differ materially: report to the Data/BI Lead."}
  - {id: A02, issue: I1, category: INVESTIGATE FIRST, type: Investigation, window: "0-30", effort: Low, reversibility: High,
     action: "Collect store operating logs, staffing coverage and local-environment information (works, access, parking, events, competitor openings and promotions) for S03 to S05 and the matched control stores from June 2025.",
     why: "Tests the internal and external explanations the Phase 6 analysis could not observe.",
     owner: Retail Operations, supporting: Commercial; Facilities, kpi: Share of listed data items obtained, trigger: "Data not obtainable by day 30: escalate to the Head of Retail."}
  - {id: A03, issue: I1, category: INVESTIGATE FIRST, type: Investigation, window: "0-30", effort: Low, reversibility: High,
     action: "Structured area-manager visits to S03 to S05 with a fixed checklist: what changed around mid-July 2025 (access, signage, parking, neighbouring shops, competitors, hours, staffing).",
     why: "Store teams often know about local changes that no system records.",
     owner: Retail Operations, supporting: Area managers, kpi: Visit reports completed, trigger: "Any identified change dated near the change point: add to the investigation log."}
  - {id: A04, issue: I1, category: INVESTIGATE FIRST, type: Investigation, window: "31-60", effort: Medium, reversibility: High,
     action: "Where footfall counters with history exist, split the transaction gap since July 2025 into footfall and conversion for the cluster and the control stores. Where they do not, the past split cannot be recovered: use proxies for the past (car-park counts, public-transport or mobile-location data, card-spend data for the catchment, where obtainable) and install counters in the three stores and two control stores to measure the current state.",
     why: "Separates 'fewer visitors' from 'fewer buyers among visitors', which point to different owners; new counters show today's position, not the cause of the July step.",
     owner: Retail Operations, supporting: Data/BI, kpi: Footfall YoY and conversion rate (new), trigger: "Footfall gap similar to the transaction gap: external or access cause likely; conversion gap: in-store cause likely."}
  - {id: A05, issue: I1, category: MONITOR, type: Monitoring, window: "0-30", effort: Low, reversibility: High,
     action: "Report the weekly transaction gap between S03 to S05 and the matched control stores on the dashboard, with the change-point check re-run monthly.",
     why: "Shows whether the loss persists, recovers or spreads while the cause is investigated.",
     owner: Data/BI, supporting: Retail Operations, kpi: Weekly transactions-per-store YoY gap vs matched controls, trigger: "Early-warning signal EW01."}
  - {id: A06, issue: I1, category: NO ACTION YET, type: Hold, window: "0-30", effort: Low, reversibility: High,
     action: "Hold any price, promotion or local-marketing response aimed at S03 to S05 until the investigation identifies a cause.",
     why: "The cause is UNRESOLVED; spend aimed at a guessed cause may not work and would blur the later measurement.",
     owner: Commercial, supporting: Retail Operations, kpi: n/a, trigger: "Lift the hold when the day-60 decision gate names a cause."}
  - {id: A07, issue: I2, category: ACT NOW, type: Control, window: "0-30", effort: Low, reversibility: High,
     action: "Weekly zero-stock exception list for the fastest-selling Electronics & Tech SKUs on their current sales rate (last 8 weeks, new launches included), starting with the three SKUs with the largest lost-sales estimates ({top3_skus|text}), sent to replenishment with a named person to act on each line.",
     why: "Full-week stock-outs are the one mechanism with root-cause evidence, and they concentrate in these SKUs.",
     owner: Supply Chain (replenishment), supporting: Store Operations, kpi: Full-week stock-outs on listed SKUs; category availability, trigger: "Early-warning signals EW03 and EW04."}
  - {id: A08, issue: I2, category: ACT NOW, type: Control, window: "0-30", effort: Low, reversibility: High,
     action: "Review reorder points and safety stock for the most affected SKUs against their current sales rate; where a parameter is out of date, adjust it as a temporary, recorded change (permanent changes wait for the I3 finding) so its effect can be measured.",
     why: "Opening stock of the affected SKUs fell; checking the internal parameters is safe whatever the supplier's role.",
     owner: Supply Chain (replenishment), supporting: Electronics & Tech buying, kpi: Weeks of cover on listed SKUs; availability, trigger: "Cover below the reorder point for two weeks on a listed SKU."}
  - {id: A09, issue: I2, category: INVESTIGATE FIRST, type: Evidence capture, window: "0-30", effort: Medium, reversibility: High,
     action: "Request daily stock positions for Electronics & Tech so partial-week stock-outs can be measured.",
     why: "The lost-sales estimate covers full-week stock-outs only; partial weeks are unmeasured.",
     owner: Data/BI, supporting: Supply Chain, kpi: Days out of stock per store-SKU (new), trigger: "n/a"}
  - {id: A10, issue: I3, category: INVESTIGATE FIRST, type: Investigation, window: "0-30", effort: Low, reversibility: High,
     action: "Extract purchase orders, confirmations, ASNs and receipts for Voltix SKUs and one comparison supplier for H2 2024 and H2 2025; calculate fill rate, OTIF and lead time; compare order quantities with the ordering parameters and forecasts in force.",
     why: "Decides whether supply or Brightwater ordering limited stock, which the current data cannot do.",
     owner: Supply Chain (supplier management), supporting: Electronics & Tech buying; Finance, kpi: Fill rate; OTIF; lead time (new), trigger: "Day-60 decision gate."}
  - {id: A11, issue: I3, category: INVESTIGATE FIRST, type: Investigation, window: "31-60", effort: Low, reversibility: High,
     action: "Joint fact-finding meeting with the Voltix account manager: share the stock-out pattern and ask for their delivery records and any constraint notices.",
     why: "The supplier may hold the delivery evidence; framing it as fact-finding keeps the relationship intact.",
     owner: Electronics & Tech buying, supporting: Supply Chain, kpi: n/a, trigger: "n/a"}
  - {id: A12, issue: I3, category: NO ACTION YET, type: Hold, window: "0-30", effort: Low, reversibility: High,
     action: "No supplier penalty, delisting or re-sourcing decision for Voltix until the order and delivery review (A10) is complete.",
     why: "The concentration is a STATISTICAL ASSOCIATION; supplier responsibility is not established.",
     owner: Commercial, supporting: Supply Chain, kpi: n/a, trigger: "Lift the hold at the day-60 decision gate."}
  - {id: A13, issue: I4, category: ACT NOW, type: Evidence capture, window: "0-30", effort: Low, reversibility: High,
     action: "In {fy_stores|text}, and as a comparison sample in three stores without an increase, keep Electronics & Tech items returned as 'Faulty' for inspection (do not dispose of them or send them back unexamined) and record batch, lot or serial numbers, for an initial eight weeks.",
     why: "Preserves the only direct evidence of whether items are defective; the comparison stores give the normal no-fault-found rate to judge against; costs little and can stop at any time.",
     owner: Quality, supporting: Store Operations, kpi: Held units inspected; batch captured on returns, trigger: "A confirmed defect in a batch still on sale: escalate to the Quality lead at once."}
  - {id: A14, issue: I4, category: INVESTIGATE FIRST, type: Investigation, window: "0-30", effort: Low, reversibility: High,
     action: "Returns-handling audit in the five stores and three comparison stores: how staff choose the return reason, and any change in guidance, systems or staff since August 2025.",
     why: "Tests the recording-practice explanation directly.",
     owner: Store Operations, supporting: Quality; Data/BI, kpi: Audit findings, trigger: "Evidence of a coding change: restate the KPI and brief Quality."}
  - {id: A15, issue: I4, category: INVESTIGATE FIRST, type: Investigation, window: "31-60", effort: Low, reversibility: High,
     action: "Request supplier RMA and defect reports and warranty claims for the most affected products ({fy_products|text}) and for all four suppliers.",
     why: "Suppliers and warranty providers see defects across all their customers.",
     owner: Electronics & Tech buying, supporting: Quality, kpi: RMA and warranty rates by SKU (new), trigger: "n/a"}
  - {id: A16, issue: I4, category: INVESTIGATE FIRST, type: Evidence capture, window: "31-60", effort: Medium, reversibility: Medium,
     action: "Add batch or serial capture to the Electronics returns process in all stores (process change; a system change only if the pilot in A13 shows it is needed).",
     why: "Without batch data the quality question cannot be answered next time either.",
     owner: Store Operations, supporting: IT; Quality, kpi: Share of Electronics returns with batch recorded, trigger: "n/a"}
  - {id: A17, issue: I4, category: MONITOR, type: Monitoring, window: "0-30", effort: Low, reversibility: High,
     action: "Monthly 'Faulty' returned units per 100 sold, by store and by sale month, on the dashboard.",
     why: "Shows whether the pattern spreads, fades or follows a sale cohort.",
     owner: Data/BI, supporting: Quality, kpi: "'Faulty' units per 100 sold", trigger: "Early-warning signal EW05."}
  - {id: A18, issue: I5, category: ACT NOW, type: Governance control, window: "0-30", effort: Low, reversibility: High,
     action: "Governance control: any new Home & Kitchen promotion deeper than the same SKU's depth in the equivalent prior-year promotion (or, with no prior-year equivalent, deeper than a depth band Commercial sets per mechanic) needs a written objective, a funding line and a planned post-event review on margin as well as sales.",
     why: "The effect of deeper promotions is uncertain in sign; writing down the objective and measuring it is sensible whatever the true effect, and it cuts nothing.",
     owner: Commercial / Trading, supporting: Finance, kpi: Share of promotions with an objective and a review, trigger: "Promotions launched without an objective: report monthly."}
  - {id: A19, issue: I5, category: INVESTIGATE FIRST, type: Investigation, window: "0-30", effort: Medium, reversibility: High,
     action: "Promotion review of the H2 2025 Home & Kitchen calendar: objective, mechanic, planned vs actual depth and supplier funding for each event.",
     why: "Establishes what the programme was meant to do before judging whether it worked.",
     owner: Commercial / Trading, supporting: Finance; Marketing, kpi: n/a, trigger: "n/a"}
  - {id: A20, issue: I5, category: INVESTIGATE FIRST, type: Investigation, window: "31-60", effort: Medium, reversibility: High,
     action: "Design, approve and launch the controlled test of Home & Kitchen promotion depth (see the test design), with marketing and legal sign-off and the analysis plan written before launch.",
     why: "Only a controlled comparison can settle a question on which the four methods disagree in sign.",
     owner: Commercial / Trading, supporting: Data/BI; Marketing; Store Operations, kpi: Test-vs-comparison-arm net revenue and gross margin per store-week, trigger: "Guardrail breach in the test: stop the test arm."}
  - {id: A21, issue: I5, category: NO ACTION YET, type: Hold, window: "0-30", effort: Low, reversibility: High,
     action: "No blanket cut and no blanket increase in Home & Kitchen promotion depth on the strength of any single Phase 6 method.",
     why: "M1 and M4 say the programme cost revenue; M2 and M3 say it added revenue. Acting on one would be acting on a guess.",
     owner: Commercial Director, supporting: Finance, kpi: n/a, trigger: "Review at the day-90 gate with the test results."}
  - {id: A22, issue: I5, category: MONITOR, type: Monitoring, window: "0-30", effort: Low, reversibility: High,
     action: "Weekly Home & Kitchen discount rate, promotion share and gross margin % against the approved promotion plan.",
     why: "Detects drift in depth or frequency while the test is prepared.",
     owner: Data/BI, supporting: Commercial / Trading, kpi: Discount rate; promotion share; gross margin %, trigger: "Early-warning signal EW07."}
  - {id: A23, issue: I6, category: MONITOR, type: Monitoring, window: "31-60", effort: Low, reversibility: High,
     action: "Monthly Electronics sales split into continuing, new and delisted SKUs, with the range plan and delisting dates attached.",
     why: "Separates normal range churn from a real decline in continuing SKUs.",
     owner: Category Management, supporting: Data/BI, kpi: Continuing-SKU sales per ranged store-week, trigger: "Continuing-SKU sales fall while new-SKU sales do not rise."}
  - {id: A24, issue: I7, category: NO ACTION YET, type: Analysis, window: "31-60", effort: Low, reversibility: High,
     action: "Decompose the unattributed residual by store, category, product, week, price, mix, returns and availability, and check the data behind it; no operational action until a driver meets the Phase 6 evidence standard.",
     why: "Keeps the explanation honest: the residual stays NOT ATTRIBUTED unless evidence says otherwise.",
     owner: Data/BI, supporting: Finance, kpi: Unattributed share of the change, trigger: "n/a"}
  - {id: A25, issue: ALL, category: ACT NOW, type: Governance control, window: "0-30", effort: Low, reversibility: High,
     action: "Start the decision log and a monthly evidence review chaired by the Data/BI Lead with the issue owners; every decision records the evidence level it relied on.",
     why: "Makes the evidence standard part of how decisions are taken, and gives a record to learn from.",
     owner: Data/BI Lead, supporting: Finance; all issue owners, kpi: Decisions logged with evidence level, trigger: "n/a"}

