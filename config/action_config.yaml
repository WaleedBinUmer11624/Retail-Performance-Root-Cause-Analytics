  - {window: "31-60", focus: Testing hypotheses, activity: "Split the cluster transaction gap into footfall and conversion (A04); test each store and local hypothesis against the timeline.", issues: [I1], actions: [A04], deliverable: "Cluster hypothesis table: supported, rejected, untestable", owner: Retail Operations}
  - {window: "31-60", focus: Supplier / replenishment analysis, activity: "Calculate fill rate, OTIF and lead time; compare orders with parameters and forecasts; joint fact-finding with Voltix (A10, A11).", issues: [I3], actions: [A10, A11], deliverable: "Supply vs ordering finding", owner: Supply Chain (supplier management)}
  - {window: "31-60", focus: Quality investigation, activity: "Inspect held returns; compare with RMA and warranty data; start batch capture in all stores if the pilot needs it (A13, A15, A16).", issues: [I4], actions: [A13, A15, A16], deliverable: "Classification of the 'Faulty' pattern", owner: Quality}
  - {window: "31-60", focus: Promotion experimentation, activity: "Approve and launch the controlled depth test with a pre-written analysis plan and marketing and legal sign-off (A20).", issues: [I5], actions: [A20], deliverable: "Test launched; analysis plan signed off", owner: Commercial / Trading}
  - {window: "31-60", focus: Measurement, activity: "Measure partial-week stock-outs from daily stock (A09); read the effect of the Electronics controls on listed SKUs; decompose the residual (A24); monthly range split (A23).", issues: [I2, I6, I7], actions: [A09, A23, A24], deliverable: "Measurement note", owner: Data/BI}
  - {window: "31-60", focus: Decision gate (day 60), activity: "Evidence review decides: cluster cause named or kept UNRESOLVED; supply vs ordering for Voltix; defect vs recording for 'Faulty' returns. Holds A06 and A12 lifted or kept.", issues: [I1, I3, I4], actions: [A06, A12], deliverable: "Decision log entries with evidence level", owner: Data/BI Lead}
  - {window: "61-90", focus: Evaluating interventions, activity: "Compare availability and stock-outs on listed SKUs before and after the controls, against unlisted SKUs; review any store-side fix for the cluster against the control stores.", issues: [I1, I2], actions: [A07, A08], deliverable: "Intervention review (effect measured, not assumed)", owner: Data/BI}
  - {window: "61-90", focus: Standardising successful controls, activity: "Keep, change or stop each control based on its measured effect; write the ones kept into standard procedures.", issues: [I2, I4, I5], actions: [A07, A08, A13, A18], deliverable: "Updated procedures", owner: Issue owners}
  - {window: "61-90", focus: Closing unsupported hypotheses, activity: "Close hypotheses the new data rejects; keep untestable ones labelled HYPOTHESIS; keep the residual NOT ATTRIBUTED unless a driver meets the evidence standard.", issues: [I1, I3, I4, I6, I7], actions: [A24], deliverable: "Updated evidence matrix (new version, Phase 6 kept as the baseline)", owner: Data/BI Lead}
  - {window: "61-90", focus: Updating management reporting, activity: "Add the new KPIs that now have data (footfall, conversion, OTIF, fill rate, confirmed-defect rate) to the dashboard; mark the rest as still unavailable.", issues: [ALL], actions: [], deliverable: "Dashboard release notes", owner: Data/BI}
  - {window: "61-90", focus: Defining ongoing monitoring, activity: "Hand the early-warning requirements to the monitoring phase with owners, recipients and the calibration still to be done; check that the Home & Kitchen test is running as designed (compliance, guardrails). No test result is read before the end date in the analysis plan.", issues: [ALL], actions: [A20, A22], deliverable: "Monitoring specification; test execution check", owner: Data/BI Lead}
  - {window: "61-90", focus: Decision gate (day 90), activity: "Evidence review keeps or changes the Home & Kitchen governance control and the promotion hold (the depth decision itself waits for the post-test gate, planned around day 150 to 180); agrees the next period's investigation list.", issues: [I5, ALL], actions: [A18, A21], deliverable: "Decision log entries; next-period plan", owner: Commercial Director}

# ----------------------------------------------------------------------------- KPI monitoring framework
# value_cy / value_py: placeholders to frozen facts, or empty when the KPI does not exist yet (never estimated).
kpis:
  - {id: K01, kpi: Net Revenue, definition: "Sales revenue minus refunds (governed Phase 4 definition)", purpose: "Headline performance", owner: Finance, frequency: Weekly, threshold: "Weekly YoY below the lower edge of its own recent weekly variation for 3 weeks: review. Band not calibrated yet.", source: "Sales and returns facts", availability: Available, exists: "Phase 7 measure [Net Revenue]", value_cy: "{nr_cy|eur2}", value_py: "{nr_py|eur2}", issues: [ALL]}
  - {id: K02, kpi: Transactions, definition: "Distinct receipts", purpose: "Customer activity", owner: Retail Operations, frequency: Weekly, threshold: "Store-level signal EW01 and estate-level signal EW02.", source: "POS", availability: Available, exists: "Phase 7 measure [Transactions]", value_cy: "{tx_cy|int}", value_py: "{tx_py|int}", issues: [I1]}
  - {id: K03, kpi: Cluster transaction gap vs matched controls, definition: "Transactions per store YoY in S03 to S05 and in the matched control stores, shown side by side; the Phase 6 difference-in-differences gives the gap", purpose: "Tracks the unresolved cluster loss", owner: Retail Operations, frequency: Weekly, threshold: "Gap widens, or a similar step appears elsewhere (EW01).", source: "POS", availability: Available, exists: "Phase 7 measure [Transactions YoY %] by Store[store_group]", value_cy: "{cl_tx_yoy|pct1} vs {mc_tx_yoy|pct1}; gap {cl_did_tx|pctv1} (Phase 6 D01, ESTIMATE)", value_py: "", issues: [I1]}
  - {id: K04, kpi: Footfall, definition: "Visitors counted at store entrances", purpose: "Separates visits from purchases", owner: Retail Operations, frequency: Daily, threshold: "Define once data exists.", source: "Footfall counters", availability: Not available, exists: "No", value_cy: "", value_py: "", issues: [I1]}
  - {id: K05, kpi: Conversion Rate, definition: "Transactions / footfall", purpose: "Shows whether visitors buy", owner: Retail Operations, frequency: Weekly, threshold: "Define once footfall exists.", source: "POS and footfall", availability: Not available, exists: "No (needs footfall)", value_cy: "", value_py: "", issues: [I1]}
  - {id: K06, kpi: UPT, definition: "Units sold / transactions", purpose: "Basket size", owner: Commercial, frequency: Weekly, threshold: "Monitor only; no signal defined.", source: "POS", availability: Available, exists: "Phase 7 measure [UPT]", value_cy: "{upt_cy|dec2}", value_py: "{upt_py|dec2}", issues: [ALL]}
  - {id: K07, kpi: ASP, definition: "Sales revenue / units sold", purpose: "Price and mix", owner: Commercial, frequency: Weekly, threshold: "Monitor only; no signal defined.", source: "POS", availability: Available, exists: "Phase 7 measure [ASP]", value_cy: "{asp_cy|eur2}", value_py: "{asp_py|eur2}", issues: [I5]}
  - {id: K08, kpi: Gross Margin %, definition: "(Net revenue minus COGS) / net revenue (Phase 4 definition)", purpose: "Profitability", owner: Finance, frequency: Weekly by category, threshold: "Category gross margin % step down vs the same weeks last year (EW06).", source: "Sales, returns, cost", availability: Available, exists: "Phase 7 measure [Gross Margin %]", value_cy: "{gmpct_cy|pct1}", value_py: "{gmpct_py|pct1}", issues: [I5]}
  - {id: K09, kpi: Availability, definition: "In-stock store-SKU-weeks / ranged store-SKU-weeks (weekly snapshot)", purpose: "Shelf availability", owner: Supply Chain, frequency: Weekly by category and supplier, threshold: "EW03.", source: "Inventory snapshots", availability: Available, exists: "Phase 7 measure [Availability]", value_cy: "{et_avail_cy|pct1} (Electronics & Tech)", value_py: "{et_avail_py|pct1} (Electronics & Tech)", issues: [I2, I3]}
  - {id: K10, kpi: Full-week stock-outs, definition: "Store-SKU-weeks with zero stock all week", purpose: "Stock-outs that stop all sales", owner: Supply Chain, frequency: Weekly by SKU and supplier, threshold: "EW04.", source: "Inventory snapshots", availability: Available, exists: "Phase 7 measure [Full-Week Stock-Outs]", value_cy: "{et_full_cy|int} (Electronics & Tech)", value_py: "{et_full_py|int} (Electronics & Tech)", issues: [I2, I3]}
  - {id: K11, kpi: Estimated lost sales, definition: "Expected sales during full-week stock-outs from an in-stock baseline (Phase 6 method)", purpose: "Sizes availability loss", owner: Data/BI, frequency: Per period review, threshold: "Not a routine alert: an ESTIMATE with a range.", source: "Phase 6 estimate", availability: "Available (analysis only, ESTIMATE)", exists: "Phase 6 electronics_lost_sales_totals.csv; Phase 7 measure [Lost Sales Gross (P6)]", value_cy: "{ls_gross|abseur} (ESTIMATE, change vs prior year)", value_py: "", issues: [I2]}
  - {id: K12, kpi: Return Rate, definition: "Refund value / sales revenue", purpose: "Returns cost", owner: Finance, frequency: Weekly, threshold: "Monitor only at estate level; category signal EW05.", source: "Returns and sales", availability: Available, exists: "Phase 7 measure [Return Rate]", value_cy: "{rr_cy|pct2}", value_py: "{rr_py|pct2}", issues: [I4]}
  - {id: K13, kpi: Faulty Return Rate, definition: "Items returned with reason 'Faulty' per 100 units sold, by sale month (recorded reason, not a verified defect)", purpose: "Quality signal", owner: Quality, frequency: Monthly by store and sale month, threshold: "EW05.", source: "Returns (linked to sale date) and sales", availability: Available, exists: "Phase 7 measure [Returned Units per 100 Sold (Sale Cohort)]", value_cy: "{fy_k202509|dec1} (Sep 2025 sales); {fy_k202511|dec1} (Nov 2025 sales)", value_py: "{fy_k202409|dec1} (Sep 2024 sales); {fy_k202411|dec1} (Nov 2024 sales)", issues: [I4]}
  - {id: K14, kpi: Confirmed defect rate, definition: "Returned items confirmed defective by inspection / items inspected", purpose: "Separates real defects from recording", owner: Quality, frequency: Monthly, threshold: "Define once inspection data exists.", source: "QA inspection", availability: Not available, exists: "No", value_cy: "", value_py: "", issues: [I4]}
  - {id: K15, kpi: Promotion Share, definition: "Promoted sales revenue / sales revenue", purpose: "Reliance on promotions", owner: Commercial / Trading, frequency: Weekly by category, threshold: "Above the approved plan (EW07).", source: "POS and promotion master", availability: Available, exists: "Phase 7 measure [Promotion Share]", value_cy: "{hk_promo_cy|pct1} (Home & Kitchen)", value_py: "{hk_promo_py|pct1} (Home & Kitchen)", issues: [I5]}
  - {id: K16, kpi: Discount Rate, definition: "Discount value / gross sales", purpose: "Depth of discounting", owner: Commercial / Trading, frequency: Weekly by category, threshold: "Above the approved plan (EW07).", source: "POS", availability: Available, exists: "Phase 7 measure [Discount Rate]", value_cy: "{hk_disc_cy|pct1} (Home & Kitchen)", value_py: "{hk_disc_py|pct1} (Home & Kitchen)", issues: [I5]}
  - {id: K17, kpi: Promotion Incrementality, definition: "Net revenue and margin in the test arm minus the comparison arm during and after the promotion period", purpose: "Whether promotions add value", owner: Commercial / Trading, frequency: Per test, threshold: "Decision rule set in the test analysis plan.", source: "Controlled test", availability: Not available, exists: "No (Phase 6 methods disagree in sign, so no value is reported)", value_cy: "", value_py: "", issues: [I5]}
  - {id: K18, kpi: Supplier OTIF, definition: "PO lines delivered on time and in full / PO lines due", purpose: "Supplier delivery performance", owner: Supply Chain, frequency: Weekly by supplier, threshold: "Define once data exists (contract service level as the reference).", source: "ERP / EDI", availability: Not available, exists: "No", value_cy: "", value_py: "", issues: [I3]}
  - {id: K19, kpi: Supplier Fill Rate, definition: "Units received / units ordered", purpose: "Supplier supply completeness", owner: Supply Chain, frequency: Weekly by supplier, threshold: "Define once data exists.", source: "ERP", availability: Not available, exists: "No", value_cy: "", value_py: "", issues: [I3]}
  - {id: K20, kpi: Forecast Accuracy, definition: "1 minus weighted absolute percentage error of SKU-week demand forecasts", purpose: "Ordering quality", owner: Supply Chain, frequency: Weekly, threshold: "Define once forecasts are available.", source: "Forecasting system", availability: Not available, exists: "No", value_cy: "", value_py: "", issues: [I3]}

# ----------------------------------------------------------------------------- early-warning requirements
# Specification for a later monitoring phase. Thresholds are CONCEPTS: none has been calibrated or tested,
# and none should be set without back-testing false-alarm and detection rates on history.
early_warning:
  - {id: EW01, signal: Store transaction deterioration, metric: "Transactions per store YoY, store vs its matched peer stores", grain: "Store-week (daily for the change-point check)", baseline: "The store's own gap to its peers over the previous 13 weeks", threshold: "A step change in the gap that persists (change-point test as in Phase 6); size and persistence rules to be calibrated", frequency: Weekly, owner: Data/BI, recipient: "Head of Retail; area manager", response: "Area manager checks for a local or operational change within one week; investigation opened if unexplained", data_now: Yes, motivated_by: "I1: the cluster loss was found at half-year; a weekly check could flag a similar step within weeks"}
  - {id: EW02, signal: Estate transaction deterioration, metric: "Estate transactions YoY", grain: Week, baseline: "Rolling 13-week YoY", threshold: "Sustained move beyond the normal weekly range; to be calibrated", frequency: Weekly, owner: Data/BI, recipient: "Head of Retail; Finance Director", response: "Review at the weekly trading meeting", data_now: Yes, motivated_by: "Headline decline"}
  - {id: EW03, signal: Availability deterioration, metric: "Availability by category and by supplier", grain: Week, baseline: "Same weeks last year and the previous 8 weeks", threshold: "Below both baselines for 4 consecutive weeks (concept); to be calibrated", frequency: Weekly, owner: Supply Chain, recipient: "Supply Chain Manager; category buyer", response: "Replenishment review of the affected supplier's SKUs", data_now: Yes, motivated_by: "I2: Electronics availability fell over H2 2025"}
  - {id: EW04, signal: Stock-out spike on top sellers, metric: "Full-week stock-outs and weeks of cover on the top {high_seller_share|pct0} of SKUs by sales", grain: Store-SKU-week (daily once DR12 exists), baseline: "Prior-year level for the same SKUs", threshold: "Any top-seller SKU with a full-week stock-out in 2 consecutive weeks (concept)", frequency: Weekly, owner: Supply Chain (replenishment), recipient: Replenishment planner, response: "Expedite or rebalance stock; log the cause", data_now: Yes, motivated_by: "I2: lost sales concentrate in a few high-selling SKUs"}
  - {id: EW05, signal: Return-rate increase by reason, metric: "'Faulty' returned units per 100 sold, by store, supplier and sale month", grain: Store-month, baseline: "Same store's prior-year rate", threshold: "Rate increase unlikely under the prior-year rate (a conditional binomial test as in Phase 6); significance level and minimum volume to be set", frequency: Monthly, owner: Quality, recipient: "Quality lead; store operations manager", response: "Hold returns for inspection in the flagged store; check recording practice", data_now: Yes, motivated_by: "I4: 'Faulty' returns concentrated in five stores"}
  - {id: EW06, signal: Margin deterioration, metric: "Gross margin % by category", grain: Category-week, baseline: "Same weeks last year", threshold: "A step down that persists for 4 weeks (concept); to be calibrated", frequency: Weekly, owner: Finance, recipient: "Finance Director; category manager", response: "Split into price, mix, promotion and cost effects", data_now: Yes, motivated_by: "I5: Home & Kitchen margin fell with deeper promotions"}
  - {id: EW07, signal: Unusual promotion behaviour, metric: "Discount rate, promotion share and promotion events by category", grain: Category-week, baseline: "The approved promotion plan (once DR29 exists); prior year until then", threshold: "Actual above plan by an agreed tolerance (to be set by Commercial)", frequency: Weekly, owner: Commercial / Trading, recipient: "Commercial Director", response: "Check the promotion has an objective and a review (A18)", data_now: Partial, motivated_by: "I5: discount depth rose sharply"}
  - {id: EW08, signal: Data completeness, metric: "Receipts per store-day and returns per store-day against expected ranges; missing snapshots", grain: Store-day, baseline: "Same weekday over the previous 8 weeks", threshold: "Zero or near-zero counts on a trading day (concept)", frequency: Daily, owner: Data/BI, recipient: Data/BI Lead, response: "Check the data feed before anyone reads the dashboard", data_now: Yes, motivated_by: "All issues: monitoring is only as good as the feed (and A01 checks this for the cluster)"}

# ----------------------------------------------------------------------------- evidence-to-action matrix
# driver: the Phase 6 row whose evidence level applies (looked up); `tag` is the figure's own evidence tag.
evidence_to_action:
  - {id: E01, finding: "H2 net revenue fell from {nr_py|eur2} to {nr_cy|eur2} ({nr_change|eur2}, {nr_yoy|pct6})", driver: null, tag: FACT,
     interpretation: "The decline is real and reconciles to the cent across Phases 4 to 7.",
     permitted: "Net revenue fell by this amount in the week-aligned H2 comparison.",
     not_permitted: "Any statement of why it fell, from this number alone.",
     next_step: "Use it as the fixed baseline for every later review."}
  - {id: E02, finding: "Attribution: cluster {d01_eur|eur}, stock-outs {d03_eur|eur}, 'Faulty' returns {d05_eur|eur}, Home & Kitchen {d07_eur|eur}, residual {d09_eur|eur}; total {att_total|eur2}", driver: null, tag: ESTIMATE,
     interpretation: "An exclusive split of the decline into estimated components plus a remainder.",
     permitted: "Each component is an estimate of how much of the change sits with that driver, without double counting.",
     not_permitted: "Adding other estimates (for example the other promotion methods or the stock-out upper bound) to it; reading a component as proof of its cause.",
     next_step: "Quote components with their evidence level every time."}
  - {id: E03, finding: "S03 to S05 transactions per store {cl_tx_yoy|pct1} vs {mc_tx_yoy|pct1} in matched controls; step change on {cl_onset|date}", driver: D01, tag: FACT,
     interpretation: "A sudden loss of receipts specific to three stores, still present at the end of the data.",
     permitted: "Three stores lost receipts relative to comparable stores from mid-July 2025; the excess decline is estimated at {d01_eur|eur}.",
     not_permitted: "That footfall fell (there is no footfall data); that a competitor, local event, staffing or customer behaviour caused it.",
     next_step: "Investigate in stages: data completeness, store operations, footfall and conversion, local environment, customers (A01 to A04)."}
  - {id: E04, finding: "External or local cause of the cluster loss", driver: D02, tag: HYPOTHESIS,
     interpretation: "The pattern fits an outside cause, but an unrecorded internal change fits equally.",
     permitted: "An external or unrecorded operational cause is a hypothesis consistent with the data.",
     not_permitted: "Naming any cause, or acting as if one were known.",
     next_step: "Collect DR01 to DR11; hold targeted spend (A06)."}
  - {id: E05, finding: "Full-week stock-outs in Electronics & Tech rose from {et_full_py|int} to {et_full_cy|int}; no sales in those weeks", driver: D03, tag: FACT,
     interpretation: "Root-cause evidence for lost sales during observed full-week stock-outs.",
     permitted: "Full-week stock-outs caused lost sales, estimated at {ls_gross|abseur} gross, {ls_net|abseur} net of deferred demand.",
     not_permitted: "That the supplier failed; that fixing availability will return {ls_gross|abseur} (it is a historical estimate, not a forecast).",
     next_step: "Low-risk replenishment controls now (A07, A08); investigate supply vs ordering (A10)."}
  - {id: E06, finding: "Voltix SKUs hold {ls_voltix_share|pct0} of the lost sales; their stock-out rate rose {vx_rate_diff|pp1u} more than other suppliers'", driver: D04, tag: STATISTICAL ASSOCIATION,
     interpretation: "Stock-out concentration is associated with Voltix SKUs. Available data cannot determine whether the cause was supplier performance or Brightwater ordering/replenishment.",
     permitted: "Stock-out concentration is associated with Voltix SKUs.",
     not_permitted: "Supplier failure, without purchase order and ASN evidence; that Brightwater's ordering was at fault, equally.",
     next_step: "Order-to-receipt review (A10); no supplier sanction until then (A12)."}
  - {id: E07, finding: "Electronics 'Faulty' refunds up {fy_change|abseur} ({fy_yoy|spct0}), concentrated in {fy_stores|text} and in items sold from September 2025", driver: D05, tag: FACT,
     interpretation: "An observed change in a recorded till reason.",
     permitted: "More Electronics refunds were recorded as 'Faulty', mainly in five stores and recent sale months.",
     not_permitted: "That the products are defective; that a supplier shipped a bad batch.",
     next_step: "Hold returns for inspection with batch capture (A13); audit recording practice (A14)."}
  - {id: E08, finding: "Product defect vs recording practice behind 'Faulty' returns", driver: D06, tag: HYPOTHESIS,
     interpretation: "Either explanation fits; no QA data either way.",
     permitted: "A product-quality problem and a recording change are both hypotheses.",
     not_permitted: "Choosing one without inspection, batch or RMA evidence.",
     next_step: "Classification framework (A13 to A16)."}
  - {id: E09, finding: "Home & Kitchen discount rate {hk_disc_py|pct1} to {hk_disc_cy|pct1}; events {hk_ev_py|int} to {hk_ev_cy|int}", driver: null, tag: FACT,
     interpretation: "The promotion programme became much deeper and more frequent.",
     permitted: "Promotion depth and frequency rose sharply.",
     not_permitted: "That this rise was a mistake or a success, from the rise alone.",
     next_step: "Promotion review (A19) and governance control (A18)."}
  - {id: E10, finding: "Home & Kitchen promotion effect: M1 {m1|seur}, M4 {m4|seur}, M2 {m2|seur}, M3 {m3|seur}", driver: D07, tag: ESTIMATE,
     interpretation: "Promotion activity is associated with the Home & Kitchen decline, but causality is not established. The methods disagree in sign.",
     permitted: "Promotion activity is associated with the Home & Kitchen decline.",
     not_permitted: "That promotions caused the category decline; summing or averaging the four methods into one promotion impact.",
     next_step: "Controlled depth test (A20); no blanket change meanwhile (A21)."}
  - {id: E11, finding: "Outside the cluster, continuing Electronics SKUs {d08_continuing|eur}; new SKUs {d08_new|seur}; delisted {d08_delisted|eur}", driver: D08, tag: FACT,
     interpretation: "A partition of the change; the decline sits in continuing SKUs.",
     permitted: "Continuing SKUs sold less per ranged week while new SKUs added revenue.",
     not_permitted: "That customers switched to new models (a hypothesis); delisting continuing SKUs on this evidence.",
     next_step: "Monthly range split with range-plan dates (A23)."}
  - {id: E12, finding: "Residual {d09_eur|eur} ({d09_share|pct0}) not attributed", driver: D09, tag: NOT ATTRIBUTED,
     interpretation: "Part of the decline has no identified driver; it also carries the uncertainty of the estimates.",
     permitted: "UNEXPLAINED / NOT ATTRIBUTED.",
     not_permitted: "Assigning it to any driver to make the explanation complete.",
     next_step: "Residual decomposition (A24); no operational action."}
  - {id: E13, finding: "Scenario values for stock-outs (see the impact framework)", driver: D03, tag: SCENARIO,
     interpretation: "Restatements of the H2 2025 estimate under stated assumptions.",
     permitted: "Under the stated assumptions, about this much of the H2 2025 loss would have been avoided.",
     not_permitted: "A forecast, a target or a promised recovery.",
     next_step: "Measure the effect of the controls instead (61 to 90 days)."}

# ----------------------------------------------------------------------------- decision log (template, first entries)
# Dates and results are left empty on purpose: they are filled when management takes the decision.
decision_log:
  - {id: DL-001, issue: I1, decision: "Hold price, promotion and local-marketing responses aimed at S03 to S05 until a cause is identified", evidence: "Phase 6 D01 (Observed change) and D02 (Hypothesis); cause UNRESOLVED", driver: D01, owner: Commercial, expected: "No spend on an unverified cause; clean measurement later", kpi: Cluster transaction gap vs controls, review: "Day 60"}
  - {id: DL-002, issue: I1, decision: "Open the staged cluster investigation (A01 to A04)", evidence: "Phase 6 D01 and D02", driver: D02, owner: Retail Operations, expected: "Cause named or confirmed UNRESOLVED by day 60", kpi: Hypotheses tested, review: "Day 30"}
  - {id: DL-003, issue: I2, decision: "Start the zero-stock exception list and reorder-point review for top-selling Electronics SKUs", evidence: "Phase 6 D03 (Root-cause evidence for the stock-out mechanism)", driver: D03, owner: Supply Chain (replenishment), expected: "Fewer full-week stock-outs on listed SKUs (to be measured, not assumed)", kpi: Full-week stock-outs on listed SKUs, review: "Day 30"}
  - {id: DL-004, issue: I3, decision: "No supplier sanction for Voltix until the order-to-receipt review is complete", evidence: "Phase 6 D04 (Statistical association)", driver: D04, owner: Commercial, expected: "Responsibility decided on order and delivery evidence", kpi: Fill rate and OTIF (new), review: "Day 60"}
  - {id: DL-005, issue: I4, decision: "Hold 'Faulty' Electronics returns in the five stores for inspection, with batch capture", evidence: "Phase 6 D05 (Observed change) and D06 (Hypothesis)", driver: D05, owner: Quality, expected: "Defect vs recording question answerable", kpi: Units inspected; confirmed-defect rate, review: "Day 30"}
  - {id: DL-006, issue: I5, decision: "No blanket change to Home & Kitchen promotion depth; governance control on deeper promotions; design a controlled depth test", evidence: "Phase 6 D07 (Statistical association; methods disagree in sign)", driver: D07, owner: Commercial Director, expected: "Promotion depth decided on test evidence at the post-test gate", kpi: Test vs comparison arm net revenue and margin, review: "Day 90 after approval (control and hold); post-test gate (depth)"}
  - {id: DL-007, issue: I7, decision: "Keep the residual labelled NOT ATTRIBUTED; decompose it analytically", evidence: "Phase 6 D09 (not attributed)", driver: D09, owner: Data/BI Lead, expected: "No forced explanation", kpi: Unattributed share, review: "Day 60"}
  - {id: DL-008, issue: ALL, decision: "Adopt the decision log and monthly evidence review", evidence: "Phase 8 framework", driver: null, owner: Data/BI Lead, expected: "Every decision records its evidence level", kpi: Decisions logged, review: "Day 30"}

# ----------------------------------------------------------------------------- business impact framework
# Three separate columns. A historical estimate is never relabelled as recoverable value.
impact:
  - {issue: I1, observed: "Transactions per store {cl_tx_yoy|pct1} vs {mc_tx_yoy|pct1} in matched controls (FACT)", estimated: "Excess decline {d01_eur|eur}, range {cl_high|eur} to {cl_low|eur} (ESTIMATE)", recoverable: Not estimated, recoverable_reason: "The cause is unknown. Some causes (a lasting change in the local market) may not be recoverable at all; others (a store-side problem) may be. No figure until the cause is known."}
  - {issue: I2, observed: "Availability {et_avail_py|pct1} to {et_avail_cy|pct1}; full-week stock-outs {et_full_py|int} to {et_full_cy|int} (FACT)", estimated: "Lost sales {ls_gross|abseur} gross, {ls_net|abseur} net of deferred demand; range {ls_low|abseur} to {ls_high|abseur} (ESTIMATE)", recoverable: Scenario only, recoverable_reason: "The mechanism is known, so the historical estimate can be restated as avoidable loss under assumptions; whether any future value exists depends on the cause being controllable (I3) and on the controls working, which is measured, not assumed. See the scenarios."}
  - {issue: I3, observed: "Voltix episodes {vx_ep_py|int} to {vx_ep_cy|int}; mean length {vx_len_py|dec1} to {vx_len_cy|dec1} weeks (FACT)", estimated: "{ls_voltix|abseur} of the lost-sales estimate (part of I2, ESTIMATE)", recoverable: Not estimated, recoverable_reason: "Included in I2's scenarios; counting it again would double count."}
  - {issue: I4, observed: "'Faulty' refunds up {fy_change|abseur} ({fy_yoy|spct0}) (FACT)", estimated: "{d05_eur|eur} in the attribution; range {d05_eur|eur} to {fy_range_low|eur} by rate basis", recoverable: Not estimated, recoverable_reason: "Refunds are a recorded cost, but whether any of it is avoidable depends on the cause: a verified defect may support supplier claims (a cost recovery, not revenue); a recording change has no revenue effect at all."}
  - {issue: I5, observed: "Discount rate {hk_disc_py|pct1} to {hk_disc_cy|pct1}; category net revenue {hk_change|eur} (FACT)", estimated: "M1 {m1|seur}, M4 {m4|seur}, M2 {m2|seur}, M3 {m3|seur}: shown separately, never combined (ESTIMATE)", recoverable: Not estimated, recoverable_reason: "The methods disagree in sign, so even the direction of any recoverable value is unknown until a controlled test is run."}
  - {issue: I6, observed: "Continuing SKUs {d08_continuing|eur}; new SKUs {d08_new|seur}; delisted {d08_delisted|eur} (FACT)", estimated: "Not quantified (a partition, not an estimate)", recoverable: Not estimated, recoverable_reason: "No driver identified."}
  - {issue: I7, observed: "Not applicable", estimated: "{d09_eur|eur}: the remainder of the attribution (NOT ATTRIBUTED)", recoverable: Not estimated, recoverable_reason: "UNEXPLAINED / NOT ATTRIBUTED: nothing to recover until a driver is identified."}

scenarios:
  intro: >-
    The scenarios restate the historical estimate under stated assumptions: how much of the H2 2025 loss would
    have been avoided. They describe the past half-year only; they are not forecasts of any future period, not
    targets and not a promised recovery. Values are rounded, in sales revenue before the cost of holding more
    stock. Only I2 has scenarios, because it is the only issue with a known mechanism.
  rows:
    - {issue: I2, scenario: Conservative, value: "{ls_zero|eur}", assumption: "Nothing is treated as avoidable until the order data (A10) shows the cause was within Brightwater's control and the controls (A07, A08) show a measured effect.", basis: "Assumption"}
    - {issue: I2, scenario: "Full elimination (best case)", value: "about {ls_net|abseurk}", assumption: "Every full-week stock-out in H2 2025 removed (the prior-year level was {et_full_py|int}); only demand that did not come back after restock counts as avoidable ({ls_deferred|abseurk} came back and is already in H2 2025 revenue); no substitution to other SKUs.", basis: "Phase 6 lost sales net of deferred demand (ESTIMATE)"}
    - {issue: I2, scenario: "Upper: not provided", value: "n/a", assumption: "No higher figure is avoidable value: the gross estimate ({ls_gross|abseurk}) and the sensitivity high ({ls_high|abseurk}) include demand that came back after restock, and the partial-week upper bound ({ls_upper_bound|abseurk}) is not evidence.", basis: "Phase 6 sensitivity analysis"}
  margin_note: >-
    On the gross estimate the margin at stake is about {ls_margin|abseurk} at the category line-margin rate
    (Phase 6 scenario B): the profit effect is much smaller than the sales figure.

# ----------------------------------------------------------------------------- investigation frameworks
frameworks:
  cluster_sequence:
    title: Store-cluster investigation sequence (I1)
    note: "Each step is cheap before the next is costly; stop when a step explains the step change on {cl_onset|date}. No cause is assumed."
    steps:
      - {step: 1, question: "Is the receipt loss real?", data: [DR01], supports: "Counts match settlement: the loss is real, go to step 2.", otherwise: "Counts differ: a data-capture problem; fix the feed and restate the figures before anything else."}
      - {step: 2, question: "Did the stores themselves change around mid-July?", data: [DR02, DR03, DR06], supports: "A dated change (shorter hours, closure, refit, lost staff, tills down) that matches the change point in each store.", otherwise: "No store-side change found: go to step 3."}
      - {step: 3, question: "Fewer visitors, or fewer buyers among visitors?", data: [DR04, DR05], supports: "Historical footfall down by a similar amount: the cause is outside the store's door (go to step 4). Conversion down: the cause is inside (return to step 2 with this evidence).", otherwise: "No historical footfall: the July split cannot be recovered; use proxies for the past, install counters for the present, and go to step 4 with the question open."}
      - {step: 4, question: "Did the local environment change?", data: [DR07, DR08], supports: "A dated competitor opening, road or access works, parking or transport change near all three stores, matching the change point.", otherwise: "Nothing found: go to step 5."}
      - {step: 5, question: "Where did the customers go?", data: [DR09, DR10, DR11], supports: "Loyal customers from these stores now shop at another Brightwater store or online, or have stopped visiting; complaints or scores changed.", otherwise: "No customer-level data: the cause stays UNRESOLVED."}
      - {step: 6, question: "Decision (day-60 gate)", data: [], supports: "Name the cause with its evidence level and choose the response (see I1's decision after investigation).", otherwise: "Keep it reported as UNRESOLVED, keep monitoring (EW01), and do not assign a cause."}
  inventory_checks:
    title: Electronics inventory investigation (I2, I3)
    note: "Each check points either to supply (the supplier delivered less or later than ordered) or to ordering (Brightwater ordered or allocated less). Neither is assumed."
    rows:
      - {check: Purchase orders, question: "What quantities were ordered, and when?", supply: "Orders kept pace with sales", ordering: "Order quantities or frequency fell", data: DR15}
      - {check: Supplier confirmations and ASNs, question: "What did the supplier confirm and ship?", supply: "Confirmed or shipped less than ordered", ordering: "Shipped what was ordered", data: DR16}
      - {check: Fill rate, question: "Units received / units ordered", supply: "Fill rate fell", ordering: "Fill rate stable", data: DR17}
      - {check: OTIF, question: "Lines on time and in full", supply: "OTIF fell", ordering: "OTIF stable", data: DR17}
      - {check: Lead times and late deliveries, question: "Did order-to-receipt time lengthen?", supply: "Lead time longer than agreed", ordering: "Lead time unchanged", data: DR18}
      - {check: Order quantity vs parameters, question: "Did orders follow the parameters in force?", supply: "Orders followed the parameters", ordering: "Parameters or overrides cut quantities", data: DR19}
      - {check: Forecast accuracy, question: "Did forecasts under-call demand for these SKUs?", supply: "Forecasts accurate", ordering: "Forecasts too low", data: DR20}
      - {check: Reorder points and safety stock, question: "Were they changed, or out of date for current sales?", supply: "Adequate and unchanged", ordering: "Lowered or stale", data: DR19}
      - {check: DC availability, question: "Was stock missing at the DC or only in stores?", supply: "Missing at the DC", ordering: "At the DC but not sent to stores", data: DR13}
      - {check: Store replenishment and allocation rules, question: "Did allocation starve some stores?", supply: "Allocation normal", ordering: "Rules or frequency changed", data: DR14}
      - {check: Supplier service levels, question: "Any known constraint or breach of contracted service?", supply: "Supplier notified a constraint", ordering: "No constraint notified", data: DR21}
  returns_classification:
    title: "'Faulty' returns classification framework (I4)"
    note: "Each explanation predicts a different pattern. Choose one only when its evidence is present and the others' is absent."
    rows:
      - {explanation: Product quality, evidence_for: "Confirmed-defect rate in the five stores clearly above the comparison stores; defects across batches of the same SKUs; warranty and RMA rates rise too", evidence_against: "Confirmed-defect and no-fault-found rates similar to the comparison stores", data: "DR22, DR24, DR25"}
      - {explanation: Specific batch, evidence_for: "Confirmed defects share batch or lot numbers; the rise follows when that batch was sold", evidence_against: "Defects spread across batches", data: "DR23, DR22"}
      - {explanation: Supplier issue, evidence_for: "Confirmed defects concentrate on one supplier; the supplier's RMA data shows the same pattern elsewhere. Phase 6: the largest supplier holds {fy_top_supplier_share|pct0} of the increase in the significant stores", evidence_against: "Phase 6: all four suppliers rose in the same stores, so a store- or distribution-side cause cannot be excluded either", data: "DR24, DR25"}
      - {explanation: Classification behaviour, evidence_for: "The five stores changed guidance, systems or staff; 'Faulty' used where other reasons would apply; inspection finds no fault", evidence_against: "Consistent coding practice across stores", data: "DR26, DR22"}
      - {explanation: Store process, evidence_for: "Handling, storage or display damage in those stores (for example a shared delivery route or stockroom issue)", evidence_against: "No process difference found", data: "DR26, DR28"}
      - {explanation: Customer behaviour, evidence_for: "Complaints or return notes show a change in how customers use or return items (for example a local policy being used)", evidence_against: "Complaints unchanged", data: "DR27"}
      - {explanation: Another cause, evidence_for: "None of the above fits", evidence_against: "n/a", data: "Keep UNRESOLVED; continue EW05"}
  promotion_framework:
    title: Home & Kitchen promotion decision framework (I5)
    rows:
      - {topic: Incrementality, question: "Did promotions add sales that would not otherwise have happened?", now: "Unknown: point estimates disagree in sign ({m4|seur} to {m2|seur})", measure: "Test vs comparison arm (K17)"}
      - {topic: Cannibalisation, question: "Did promoted SKUs take sales from other SKUs in the category?", now: "Phase 6 event study found none measurable ({hk_cannib_cy|abseur} in both years, ESTIMATE), but its baselines are contaminated, so this is weak evidence", measure: "Category-level test outcome, not SKU-level uplift"}
      - {topic: Pull-forward, question: "Did customers buy earlier rather than more?", now: "Post-promotion shortfall estimated at {hk_dip_py|abseur} (H2 2024) and {hk_dip_cy|abseur} (H2 2025), ESTIMATE", measure: "Post-period of at least 4 weeks in the test"}
      - {topic: Baseline selection, question: "What would sales have been without the promotion?", now: "Contaminated: {m3_contam|pct0} of current-year events follow another promotion", measure: "The comparison arm provides the baseline"}
      - {topic: Margin impact, question: "Did promotions add or remove gross margin?", now: "M1 gross margin effect {m1_gm|seur} (ESTIMATE); discount cost {hk_disc_cost_py|abseur} to {hk_disc_cost_cy|abseur} (FACT)", measure: "Gross margin per store-week in the test, after supplier funding"}
      - {topic: Basket attachment, question: "Did promoted items bring other purchases?", now: "Not measured", measure: "Basket analysis of test stores (transactions with vs without a promoted H&K item)"}
      - {topic: Customer segment, question: "Which customers respond?", now: "Not measurable without customer data", measure: "Loyalty data if available (DR10, DR35)"}
      - {topic: Promotion objective, question: "What was each promotion for?", now: "Not recorded in the data", measure: "Promotion review (A19) and governance control (A18)"}
      - {topic: Control groups, question: "Against what do we judge a promotion?", now: "Phase 6 used control categories in the same store-weeks", measure: "Randomised comparison arm (stores or time periods)"}
      - {topic: Elasticity, question: "How do volumes respond to depth?", now: "M1: units {m1_units|pct1} against control categories (CI {m1_units_ci_low|pct1} to {m1_units_ci_high|spct1}, not significant) while price fell, so the fall was mostly price; elasticity not estimated", measure: "Two depth arms in the test if store numbers allow"}
      - {topic: Post-promotion behaviour, question: "What happens after the promotion ends?", now: "See pull-forward", measure: "Test post-period"}
  test_design:
    title: Controlled test of Home & Kitchen promotion depth (design outline for approval)
    items:
      - "Question: does the current Home & Kitchen promotion depth add net revenue and gross margin, compared with the prior-year depth?"
      - "Arms: a test arm at the current depth and a comparison arm at the prior-year depth. The comparison arm still runs promotions (it is a lower-depth arm, not a no-promotion holdout)."
      - "What varies: only in-store, unadvertised mechanics (shelf-edge depth and multibuys on Home & Kitchen lines not in the national flyer or online), because nationally advertised prices must be the same in every store. Marketing and legal (price-display and consumer-protection rules) sign off the design before launch."
      - "Units and assignment: stores, excluding S03 to S05 (their unresolved traffic loss would contaminate the comparison). Stores close enough to share customers go to the same arm (cluster randomisation) to limit cross-shopping; clusters are paired on prior-year Home & Kitchen sales and, where possible, region and format, and one of each pair is assigned at random. If store numbers are too small, use a time switchback instead (alternating depth by fortnight in all stores)."
      - "Duration: one full promotion cycle, planned at 8 to 12 weeks, plus a post-period of at least 4 weeks to measure pull-forward. Launch in days 31 to 60, so the result arrives after day 90."
      - "Primary metrics: Home & Kitchen net revenue and gross margin per store-week (after supplier funding). Secondary: units, basket attachment, other-category sales in the same baskets."
      - "Analysis: difference-in-differences against the pre-period, written before launch; confidence intervals reported; no early stopping except on a guardrail."
      - "Power: with {n_test_stores|int} eligible stores the test can detect only large effects; if the pre-test power check says it cannot detect an effect of the size in question, extend the duration or run the test twice rather than read a weak result."
      - "Guardrails: stop an arm if gross margin or availability falls outside an agreed limit; stores must not add local promotions during the test."
      - "Decision (post-test gate, planned around day 150 to 180): keep the depth the test shows adds margin; move towards the prior-year depth only where the test shows it loses margin; if the result is inconclusive, keep the current depth under the governance control (A18) and extend or repeat the test. Record the decision and the evidence in the decision log."
  residual_dimensions:
    title: Residual investigation framework (I7)
    note: "The residual stays labelled UNEXPLAINED / NOT ATTRIBUTED unless a new driver meets the Phase 6 evidence standard."
    rows:
      - {dimension: Store, check: "Which stores outside the cluster hold it?", data: "Existing model"}
      - {dimension: Category, check: "Which category (Electronics continuing SKUs hold most of it)?", data: "Existing model"}
      - {dimension: Product, check: "Which SKUs; are they the same as the stock-out SKUs?", data: "Existing model"}
      - {dimension: Week, check: "Does it start at a date (a step) or build gradually?", data: "Existing model"}
      - {dimension: Price, check: "Did ASP move on the affected SKUs?", data: "Existing model"}
      - {dimension: Mix, check: "Did the sales mix shift to cheaper SKUs?", data: "Existing model"}
      - {dimension: Returns, check: "Do returns other than 'Faulty' explain any of it?", data: "Existing model"}
      - {dimension: Availability, check: "Do partial-week stock-outs explain it?", data: "DR12 (daily stock)"}
      - {dimension: Customer behaviour, check: "Did customers switch models or channels?", data: "DR35, DR11"}
      - {dimension: Data quality, check: "Any gaps, late loads or quarantined rows concentrated in the affected stores or weeks?", data: "Phase 3 data-quality outputs"}
