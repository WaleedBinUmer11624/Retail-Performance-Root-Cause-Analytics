# Phase 8: business action plan, decision support and impact framework (used by src/actions).
#
# Phase 8 adds no analysis. Every number in its outputs is read from a frozen Phase 5, 6 or 7 file through
# src/actions/facts.py and written into the text through {placeholders}; this file holds no euro amount,
# percentage or count of its own (a test checks that). Evidence levels are copied from the Phase 6 evidence
# matrix and never set here. Owners, ratings, thresholds and timings are PROPOSALS for management.

inputs:
  allowed_files:
    - config/project_config.yaml
    - config/sql_model_config.yaml
    - config/analytics_config.yaml
    - config/rca_config.yaml
    - config/powerbi_config.yaml
    - config/action_config.yaml
    - reports/phase5/phase1_4_input_manifest.csv
    - reports/phase6/phase1_5_input_manifest.csv
    - reports/phase7/phase1_6_input_manifest.csv
    - reports/phase8/phase1_7_input_manifest.csv
  # Phase 7 files frozen for Phase 8 (added to the Phase 1-6 lists of the earlier configs). The Phase 7
  # validation report and run log record run times and are excluded, as for the earlier phases.
  phase7_frozen:
    - src/powerbi/*.py
    - sql/powerbi/*.sql
    - config/powerbi_config.yaml
    - docs/07_power_bi_dashboard_design.md
    - tests/test_phase7_powerbi.py
    - reports/phase7/*.csv
    - reports/phase7/mockups/*.png
    - powerbi/*.json
    - powerbi/dax/*
    - powerbi/power_query/*.pq
    - powerbi/data/*.csv
  freeze_manifest: reports/phase8/phase1_7_input_manifest.csv
  phase7_checks: reports/phase7/phase7_validation_checks.csv
  phase7_register: reports/phase7/dashboard_number_register.csv

outputs:
  reports: reports/phase8
  figures: reports/phase8/figures

# ----------------------------------------------------------------------------- decision rules
# Ratings use three transparent levels. Two are computed from the frozen results; the others are judgements
# (PROPOSED) with a written reason. None is a score: they are not added or multiplied.
ratings:
  financial_relevance:        # |attribution amount| / |H2 net revenue change|
    High: 0.20                # at least 20% of the decline
    Medium: 0.05              # 5% up to 20%
    # below 5%: Low; a partition or overlapping slice is not re-counted (see issue notes)
  evidence_strength:          # strength of CAUSAL evidence, Phase 7 scale (config/powerbi_config.yaml)
    High: 3                   # Root-cause evidence
    Medium: 2                 # Statistical association
    # 0 or 1 (Hypothesis, Observed change, Unresolved): Low
  definitions:
    business_urgency: "High: harm continues while we wait or evidence may be lost; Medium: harm continues but slowly; Low: no ongoing harm identified."
    implementation_effort: "Effort of the immediate safe actions only. Low: existing people and data; Medium: new data request or process change; High: system change or external spend."
    reversibility: "Of the immediate safe actions. High: can be stopped next week at no cost; Medium: some sunk cost; Low: hard to undo."
    data_requirement: "Data needed before a stronger decision. Low: the project already has it; Medium: internal data not yet in the model; High: external or new data."
    risk_of_acting_now: "Risk of acting on the current evidence as if the cause were known. High: likely to spend money on the wrong cause or damage a relationship; Medium: some waste; Low: little downside."
    time_to_validate: "Planning assumption, not a measured duration. Short: within 30 days; Medium: 31 to 60 days; Long: more than 60 days."

# How the decision category follows from the ratings (applied in src/actions/framework.py and tested):
#   1. no identified driver (not attributed)                                        -> NO ACTION YET
#   2. evidence High AND immediate actions reversible (High) AND risk of acting Low  -> ACT NOW
#   3. financial relevance High or Medium, OR urgency High, OR risk of acting High    -> INVESTIGATE FIRST
#   4. otherwise                                                                     -> MONITOR
# A large number alone never gives ACT NOW: rule 2 needs High causal evidence.
decision_rule_text:
  - "No identified driver (the amount is not attributed): NO ACTION YET beyond analysis."
  - "High causal evidence, reversible immediate actions and low risk of acting: ACT NOW."
  - "Financial relevance High or Medium, or urgency High, or high risk of acting on the wrong cause: INVESTIGATE FIRST."
  - "Otherwise: MONITOR."
# Issue category = what management decides about the problem. Each action inside an issue has its own category.
action_rule_text: >-
  An action can be ACT NOW, even inside an INVESTIGATE FIRST issue, only if it is reversible, low effort and low
  risk, and it is one of three things: an operational control resting on root-cause evidence (only I2 qualifies),
  evidence capture that would otherwise be lost, or a governance control that changes no commercial lever.

# ----------------------------------------------------------------------------- issues (one per management question)
# drivers: Phase 6 driver ids; evidence levels, cause status and figure type are looked up, never typed here.
# relevance: attribution = share of the decline from the Phase 6 attribution for `attribution_driver`;
#            slice = part of another issue's amount (not re-counted); partition = not quantified.
issues:
  - id: I1
    title: Store-cluster transaction loss (S03, S04, S05)
    drivers: [D01, D02]
    relevance: attribution
    attribution_driver: D01
    observed_evidence: >-
      Transactions per store in S03, S04 and S05 fell {cl_tx_yoy|abspct1} against {mc_tx_yoy|abspct1} in the matched
      control stores ({mc_stores|text}); a single step change on {cl_onset|date} (S03 {cl_onset_s03|dmon},
      S04 {cl_onset_s04|dmon}, S05 {cl_onset_s05|dmon}). Their transactions were still {cl_gap_last_pct|abspct0}
      below the control-store path in retail week {cl_gap_last_week|int}, the last week of the data.
    financial_note: >-
      Estimated excess decline {d01_eur|eur} ({d01_share|pct0} of the change), range {cl_high|eur} to
      {cl_low|eur} across control groups and windows. ESTIMATE of an observed change, measured against the
      control stores; not a measured loss and not a cause.
    what_we_know: >-
      The loss is in the number of receipts, across all categories, weekdays and hours. Basket value
      ({cl_atv|eur2} vs {mc_atv|eur2} in the controls), prices, promotion share, availability and return rate
      moved like the control stores. No internal lever in the data explains it. Caveats carried from Phase 6:
      no matched control store is in Dublin (the cluster's region), and the three stores were picked in Phase 5
      because they fell most, so the placebo test overstates significance; using the two other Dublin stores as
      controls gives a similar size ({cl_dublin_excess|eur}).
    what_we_do_not_know: >-
      Why customers made fewer purchases: fewer visitors, lower conversion, a change in the stores (hours,
      closures, works, staffing) that is not recorded in the model, or something outside the stores. Whether
      it has recovered since the end of the data.
    business_risk: >-
      The largest single component of the decline and it had not recovered by the end of the data. Acting on
      a guessed cause (price cuts, local marketing) could spend money without effect, while the real cause
      continues.
    immediate_safe_action: >-
      Confirm the receipt counts are complete for the three stores; collect the operational and local data
      listed; run structured area-manager visits; track the gap to the control stores weekly. No price,
      promotion or marketing response aimed at these stores until a cause is identified.
    investigation_required: >-
      A staged investigation (see the investigation sequence): data completeness first, then store operations,
      footfall and conversion, then the local environment, then customer behaviour.
    data_ids: [DR01, DR02, DR03, DR04, DR05, DR06, DR07, DR08, DR09, DR10, DR11]
    owner: Retail Operations
    supporting: Commercial; Store managers S03 to S05; Data/BI; Finance
    kpi: Transactions per store YoY, cluster vs matched controls (weekly gap); footfall and conversion once available
    trigger: >-
      Escalate to the Head of Retail if the weekly gap to the control stores widens further, or if another
      store shows a step change of the same kind (early-warning signal EW01).
    review_frequency: Weekly during the investigation; monthly after a decision
    decision_after_investigation: >-
      If a store-side cause is found (hours, closure, works, staffing): fix it and track the gap back toward the
      controls. If a temporary external cause (road works, local disruption): monitor to its end date. If a
      lasting external cause (for example a new competitor): decide a commercial response and test it against
      control stores before rolling it out. If nothing is found: keep it reported as UNRESOLVED and keep
      monitoring; do not assign a cause.
    ratings:
      business_urgency: [High, "The gap had not closed by the last week of the data, so the loss is likely ongoing."]
      implementation_effort: [Medium, "Data requests and store visits use existing people; proxy data or temporary counters (A04) may need spend."]
      reversibility: [High, "Data collection and visits commit nothing."]
      data_requirement: [High, "Footfall, competitor and local-event data are not in the model."]
      risk_of_acting_now: [High, "The cause is unknown; a price or marketing response could target the wrong problem."]
      time_to_validate: [Medium, "Operational logs are quick; footfall and external data may take weeks to obtain."]

  - id: I2
    title: Electronics & Tech full-week stock-outs
    cause_note: "D03: Established only for lost sales during full-week stock-outs; why stock ran out: not established (I3)"
    drivers: [D03]
    relevance: attribution
    attribution_driver: D03
    observed_evidence: >-
      Electronics & Tech availability fell from {et_avail_py|pct1} to {et_avail_cy|pct1}; full-week stock-outs
      (store-SKU-weeks with no stock all week) rose from {et_full_py|int} to {et_full_cy|int}, of which
      {vx_full_cy|int} on Voltix Distribution Ltd SKUs (prior year {vx_full_py|int}). Zero units were sold in
      every full-week stock-out.
    financial_note: >-
      Estimated lost sales {ls_gross|abseur} gross ({d03_share|pct0} of the change); {ls_net|abseur} net of the
      demand that came back after restock ({ls_deferred|abseur}); sensitivity range {ls_low|abseur} to
      {ls_high|abseur}. ESTIMATE. {ls_top10|pct0} of the lost sales sits in the top {high_seller_share|pct0} of SKUs by prior-year sales (the Phase 6
      definition); the
      three largest SKUs ({top3_skus|text}) hold {ls_top3|pct0}.
    what_we_know: >-
      The mechanism is visible: no stock, no sales. It is concentrated in a small number of high-selling SKUs.
      Some demand returned after restock, so part of the gross loss was deferred rather than lost.
    what_we_do_not_know: >-
      Why stock ran out (see I3). How much was lost in partial-week stock-outs (only weekly snapshots are
      available). How much demand moved to other SKUs.
    business_risk: >-
      Small in the decline, but it is the one mechanism the evidence establishes, and it affects the
      highest-selling SKUs, which customers notice.
    immediate_safe_action: >-
      A weekly zero-stock exception list for the fastest-selling Electronics SKUs on current sales (including new
      launches), starting with the three SKUs with the largest lost-sales estimates ({top3_skus|text}), routed to
      replenishment; a review of reorder points and safety stock for the most affected SKUs against
      current sales rates. These are internal replenishment controls and do not assume the supplier is at fault.
    investigation_required: >-
      Request daily stock positions so partial-week stock-outs can be measured; the cause of the stock
      shortfall is investigated under I3.
    data_ids: [DR12, DR13, DR14]
    owner: Supply Chain (replenishment)
    supporting: Store Operations; Electronics & Tech buying; Data/BI
    kpi: Electronics & Tech availability; full-week stock-outs; zero-stock weeks on the top-selling SKUs
    trigger: >-
      Escalate if a top-selling SKU has a full-week stock-out in two consecutive weeks, or if category
      availability stays below its prior-year level for four weeks (early-warning signals EW03 and EW04).
    review_frequency: Weekly
    decision_after_investigation: >-
      Keep the exception list if availability on the listed SKUs improves; keep, reverse or make permanent the
      temporary parameter changes only after I3 shows whether ordering or supply limited stock.
    ratings:
      business_urgency: [Medium, "Stock-outs continue while unmanaged, but the estimated amount is small."]
      implementation_effort: [Low, "Uses the weekly stock data already in the model."]
      reversibility: [High, "An exception list and a parameter review can be stopped at no cost."]
      data_requirement: [Low, "The controls use existing data; only the partial-week measure needs daily stock."]
      risk_of_acting_now: [Low, "Checking stock on best sellers has little downside whatever the cause."]
      time_to_validate: [Short, "Availability on the listed SKUs can be read within weeks."]

  - id: I3
    title: Voltix Distribution Ltd stock-out concentration (supply vs ordering)
    drivers: [D04]
    relevance: slice
    slice_of: I2
    observed_evidence: >-
      Voltix stock-out episodes rose from {vx_ep_py|int} to {vx_ep_cy|int} and their mean length from
      {vx_len_py|dec1} to {vx_len_cy|dec1} weeks. The SKU stock-out rate rose {vx_rate_diff|pp1u} more than for
      other suppliers' SKUs. Opening stock of its SKUs fell while weekly receipts per SKU did not.
    financial_note: >-
      {ls_voltix|abseur} ({ls_voltix_share|pct0}) of the {ls_gross|abseur} lost-sales estimate sits on Voltix
      SKUs. Part of I2: not an additional amount.
    what_we_know: >-
      The concentration is statistically robust (it survives leaving out any single SKU).
    what_we_do_not_know: >-
      Whether Voltix delivered less or later than ordered, or Brightwater ordered or replenished less. The data
      has receipts, not orders.
    business_risk: >-
      Blaming or re-sourcing a supplier without order and delivery evidence could damage a relationship and
      would not fix an internal ordering problem.
    immediate_safe_action: >-
      Collect purchase orders, confirmations, ASNs and receipts for Voltix SKUs; share the stock pattern with
      Voltix as joint fact-finding, not as a performance claim. No penalty, delisting or re-sourcing decision
      until the order and delivery data are reviewed.
    investigation_required: >-
      Compare what was ordered, confirmed, shipped and received, and when, for H2 2024 and H2 2025; compare
      order quantities with Brightwater's own ordering parameters and forecasts; check DC availability and
      store allocation rules for these SKUs.
    data_ids: [DR15, DR16, DR17, DR18, DR19, DR20, DR21]
    owner: Supply Chain (supplier management)
    supporting: Electronics & Tech buying (supplier relationship); Commercial (supplier sanction decisions); Finance; Voltix account manager
    kpi: Supplier fill rate and OTIF (not available yet); Voltix SKU availability
    trigger: >-
      Escalate to the Commercial Director if order data shows short or late supply; to the Supply Chain
      Manager if it shows Brightwater under-ordered.
    review_frequency: Fortnightly until the order data is reviewed
    decision_after_investigation: >-
      Supplier-side cause: raise it through the supplier review with the evidence (fill rate, OTIF, lead time).
      Ordering-side cause: correct parameters or forecasts. Both or neither: document it and keep monitoring.
    ratings:
      business_urgency: [Medium, "Stock-outs continue, but I2's controls reduce the harm while this is investigated."]
      implementation_effort: [Low, "The data request is internal; the supplier conversation is routine."]
      reversibility: [High, "Collecting data and a fact-finding meeting commit nothing."]
      data_requirement: [High, "Purchase order, ASN and delivery data are not in the model."]
      risk_of_acting_now: [High, "Treating an association as supplier failure could damage the relationship and miss an internal cause."]
      time_to_validate: [Medium, "Depends on how quickly order and delivery history can be extracted."]

  - id: I4
    title: Electronics & Tech 'Faulty' returns
    drivers: [D05, D06]
    relevance: attribution
    attribution_driver: D05
    observed_evidence: >-
      Refunds recorded with the reason 'Faulty' rose by {fy_change|abseur} ({fy_yoy|spct0}). The top five
      stores ({fy_stores|text}) hold {fy_top5_stores|pct0} of the gross increase; the rise starts mainly with
      items sold from September 2025 ({fy_k202509|dec1} 'Faulty' returns per 100 units sold for September 2025
      sales against {fy_k202409|dec1} a year earlier). Other return reasons did not rise materially (the largest
      change, 'Damaged', was {fy_damaged|seur}).
    financial_note: >-
      {d05_eur|eur} ({d05_share|pct0} of the change): a FACT (recorded refunds), range {d05_eur|eur} to
      {fy_range_low|eur} depending on the rate basis. The share is small; the question is quality and process,
      not size.
    what_we_know: >-
      The increase is in the recorded till reason, concentrated in five stores and in recent sale months, and
      spread across products (the top five products hold only {fy_top5_products|pct0}) and across all four
      suppliers.
    what_we_do_not_know: >-
      Whether the products are defective. A till reason is not an inspection result. The pattern fits a batch
      problem, a supplier problem, a change in how those stores record returns, a store process, customer
      behaviour or another cause; the data cannot choose between them.
    business_risk: >-
      If products are defective, faulty stock may still be on sale and customers affected; supplier claim
      windows may apply (check the contracts). If it is a recording practice, the returns data is misleading
      for every later analysis.
    immediate_safe_action: >-
      Keep 'Faulty' Electronics returns in the five stores, and a comparison sample from three other stores, for
      inspection instead of disposing of or returning them unexamined, and record batch, lot or serial numbers; audit how the five stores apply the 'Faulty'
      reason; request supplier RMA and warranty data.
    investigation_required: >-
      QA inspection of returned units; batch and serial analysis; supplier RMA and warranty comparison; a
      returns-handling audit against comparison stores; see the classification framework.
    data_ids: [DR22, DR23, DR24, DR25, DR26, DR27, DR28]
    owner: Quality / Buying (Electronics & Tech)
    supporting: Store Operations (returns process); Customer Service; Supplier quality contacts; Data/BI
    kpi: "'Faulty' returned units per 100 sold, by store and by sale month; QA confirmed-defect rate (not available yet)"
    trigger: >-
      Escalate to the Quality lead at once if inspection confirms a defect in a batch still on sale; escalate if
      the 'Faulty' rate rises in stores outside the five (early-warning signal EW05).
    review_frequency: Fortnightly until inspection results are in; monthly after
    decision_after_investigation: >-
      Confirmed defect in a batch or supplier: a quality decision (withdraw the batch, supplier claim) owned by
      Quality. Recording practice: clarify the reason codes and retrain, and restate the KPI. Neither: keep
      monitoring and report the cause as unresolved.
    ratings:
      business_urgency: [High, "Possible customer impact and evidence (returned units) that may be disposed of if not kept."]
      implementation_effort: [Low, "Holding returns and an audit use existing staff."]
      reversibility: [High, "Holding units for inspection and an audit can be stopped at once."]
      data_requirement: [High, "QA, batch and RMA data are not in the model."]
      risk_of_acting_now: [Medium, "Pulling products or claiming against suppliers without inspection could be wrong."]
      time_to_validate: [Medium, "Inspection of held units is quick; RMA and warranty data depend on suppliers."]

  - id: I5
    title: Home & Kitchen promotions
    drivers: [D07]
    relevance: attribution
    attribution_driver: D07
    observed_evidence: >-
      The Home & Kitchen discount rate rose from {hk_disc_py|pct1} to {hk_disc_cy|pct1} of gross sales and
      promotion events from {hk_ev_py|int} to {hk_ev_cy|int}; promotion share of sales from {hk_promo_py|pct1}
      to {hk_promo_cy|pct1}. Category net revenue fell {hk_change|abseur}, units {hk_units_yoy|abspct1}, and average
      selling price from {hk_asp_py|eur2} to {hk_asp_cy|eur2}.
    financial_note: >-
      Attribution uses M1: {d07_eur|eur} ({d07_share|pct0} of the change). The four Phase 6 methods disagree:
      M1 {m1|seur}, M4 {m4|seur}, M2 {m2|seur}, M3 {m3|seur}. They are shown separately and never added. Point
      estimates run from {m4|eur} (M4) to {m2|seur} (M2), and {m4_ci_low|eur} to {m2_ci_high|seur} including their
      intervals: even the sign is uncertain.
    what_we_know: >-
      Promotions became deeper and more frequent while the category fell against other categories in the same
      stores and weeks, mostly through price rather than volume.
    what_we_do_not_know: >-
      Whether the promotions caused the decline or added revenue: incrementality, pull-forward, cannibalisation
      and the right baseline are all unresolved, because back-to-back promotions
      ({m3_contam|pct0} of current-year events) contaminate the baselines.
    business_risk: >-
      Cutting promotions on the strength of M1 or M4 could remove revenue if M2 and M3 are right; continuing
      unchanged could keep eroding margin if M1 and M4 are right.
    immediate_safe_action: >-
      Every new Home & Kitchen promotion deeper than the prior-year depth needs a written objective and a
      planned post-event review on margin as well as sales; no blanket cut and no blanket increase.
    investigation_required: >-
      A promotion review of the H2 2025 calendar (objectives, planned vs actual depth, funding), then a
      controlled test of promotion depth; see the test design.
    data_ids: [DR29, DR30, DR31, DR32, DR33]
    owner: Commercial / Trading (Home & Kitchen)
    supporting: Marketing; Finance; Data/BI
    kpi: Home & Kitchen discount rate, promotion share, gross margin %; promotion incrementality once a test exists
    trigger: >-
      Escalate if the discount rate or promotion share rises above the approved plan, or if category gross
      margin % falls a further step (early-warning signal EW07).
    review_frequency: Monthly; weekly while a test runs
    decision_after_investigation: >-
      At the post-test gate (after the test and its post-period, planned around day 150 to 180): keep the depth
      the test shows adds net margin; move towards the prior-year depth only where the test shows it loses
      margin. An inconclusive test is not a reason to cut: keep the current depth under the governance control
      and extend or repeat the test. Until then, do not claim an effect either way.
    ratings:
      business_urgency: [Medium, "Margin is exposed each week, but the direction of the effect is unknown."]
      implementation_effort: [Medium, "A controlled test needs planning across Commercial, Marketing and stores."]
      reversibility: [High, "A written objective and a review step can be dropped at any time."]
      data_requirement: [Medium, "Promotion objectives and plans exist internally; elasticities need a test."]
      risk_of_acting_now: [High, "The methods disagree in sign; a blanket change could go the wrong way."]
      time_to_validate: [Long, "A controlled test needs a full promotion cycle plus a post-period; its result arrives after day 90."]

  - id: I6
    title: Electronics & Tech range and continuing-SKU sales
    drivers: [D08]
    relevance: partition
    observed_evidence: >-
      Outside the cluster, new Electronics SKUs added {d08_new|abseur}, delisted SKUs lost {d08_delisted|abseur} and
      continuing SKUs sold {d08_continuing|abseur} less, mostly through lower sales per ranged week.
    financial_note: >-
      A partition of the category change (FACT), not an estimate of a cause; not added to the attribution. Most
      of the unattributed residual sits here (see I7).
    what_we_know: >-
      The range change itself added revenue; the decline sits in continuing SKUs.
    what_we_do_not_know: >-
      Whether shoppers switched to the new models, partial-week stock-outs cut sales, or substitution during
      stock-outs explains it.
    business_risk: >-
      Low on its own; misreading it could lead to delisting SKUs whose sales simply moved to newer models.
    immediate_safe_action: >-
      None beyond monitoring continuing, new and delisted SKU sales monthly.
    investigation_required: >-
      Link range plan and delisting dates to SKU sales; use customer purchase history (if loyalty data exists)
      to see switching between models.
    data_ids: [DR12, DR34, DR35]
    owner: Category Management (Electronics & Tech)
    supporting: Buying; Data/BI
    kpi: Continuing-SKU sales per ranged store-week; new and delisted SKU sales
    trigger: >-
      Review if continuing-SKU sales per ranged week fall further while new-SKU sales do not rise.
    review_frequency: Monthly
    decision_after_investigation: >-
      If switching explains it: no action (a normal range cycle). If partial-week stock-outs explain it: fold
      into I2. If neither: keep in the residual investigation.
    ratings:
      business_urgency: [Low, "No harm identified beyond the normal range cycle."]
      implementation_effort: [Low, "Uses existing SKU data."]
      reversibility: [High, "Monitoring only."]
      data_requirement: [Medium, "Range plans are internal; customer-level history may not exist."]
      risk_of_acting_now: [Medium, "Delisting on this evidence could remove SKUs whose sales merely moved."]
      time_to_validate: [Medium, "Needs range plans and, ideally, customer-level data."]

  - id: I7
    title: Residual decline not attributed
    drivers: [D09]
    relevance: attribution
    attribution_driver: D09
    observed_evidence: >-
      {d09_eur|eur} ({d09_share|pct0} of the change) is not attributed to any driver. By where it sits: other
      stores' Electronics change not explained by stock-outs or 'Faulty' returns {res_et_other|eur}; other
      stores' Home & Kitchen change beyond M1 {res_hk_other|seur}; other stores' other categories
      {res_other_cat|seur}; the cluster's change at the control-store rate {res_cluster_rate|eur}.
    financial_note: >-
      UNEXPLAINED / NOT ATTRIBUTED. The remainder of the attribution, so it also absorbs the uncertainty of
      every estimate above. Not assigned to any driver.
    what_we_know: >-
      Outside the cluster, categories other than Electronics and Home & Kitchen were flat, so it is not
      estate-wide softness. Most of it is Electronics continuing-SKU sales outside the cluster.
    what_we_do_not_know: >-
      What drives it. Forcing it into an existing explanation would overstate that explanation.
    business_risk: >-
      Low on its own; the risk is analytical: hiding it would make the explanation look more complete than it is.
    immediate_safe_action: >-
      No operational action. Decompose it further by store, category, product, week, price, mix, returns and
      availability, and check the data behind it.
    investigation_required: >-
      See the residual investigation framework.
    data_ids: [DR12, DR35, DR36]
    owner: Data/BI Lead
    supporting: Finance; Category Management
    kpi: Unattributed share of the change at each future period review
    trigger: >-
      Re-examine if the unattributed share grows in the next period's attribution.
    review_frequency: At each period review
    decision_after_investigation: >-
      Attribute a part only where a new driver meets the Phase 6 evidence standard; keep the rest labelled
      NOT ATTRIBUTED.
    ratings:
      business_urgency: [Low, "No operational harm identified."]
      implementation_effort: [Low, "Analysis on existing data."]
      reversibility: [High, "Analysis only."]
      data_requirement: [Medium, "Daily stock and customer-level data would help."]
      risk_of_acting_now: [Medium, "Assigning it to a driver without evidence would double-count or mislead."]
      time_to_validate: [Medium, "Depends on the daily stock and customer data."]

