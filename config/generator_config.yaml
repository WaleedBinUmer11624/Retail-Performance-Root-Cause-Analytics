seasonality:
  q4_centre_week: 50              # retail week of the Christmas peak
  q4_width_weeks: 2.2
  black_friday_week: 48
  summer_centre_week: 21
  summer_width_weeks: 6.0
  bts_centre_week: 34             # back to school (late August)
  bts_width_weeks: 1.6
  jan_dip_weeks: [1, 2, 3, 4, 5]

promotions:
  # Chain-wide promotion events. Each event covers a share of a category's SKUs.
  default:
    cadence_weeks: 6              # a new event every N weeks
    duration_weeks: 2
    sku_coverage: 0.22
    depths: [0.10, 0.15, 0.20, 0.25]
    depth_probs: [0.25, 0.40, 0.25, 0.10]
    store_participation: 0.92
    elasticity: 2.2               # uplift = 1 + elasticity * depth + display_effect
    display_effect: 0.10
    pull_forward_share: 0.30      # share of incremental units borrowed from the next weeks
    pull_forward_weeks: 2
  overrides:                      # category-specific differences to the default
    Electronics & Tech: {elasticity: 2.8, pull_forward_share: 0.25}
    Health & Beauty: {cadence_weeks: 4, elasticity: 2.0, pull_forward_share: 0.40}
    Stationery & Crafts: {cadence_weeks: 8, elasticity: 1.5}
    Home & Kitchen: {elasticity: 2.4, pull_forward_share: 0.35}
  clearance:                      # post-Christmas clearance on Seasonal & Gifts
    category: Seasonal & Gifts
    retail_weeks: [1, 2, 3]
    depths: [0.40, 0.50]
    sku_coverage: 0.70

inventory:
  cover_weeks: {Flagship: 1.6, Standard: 1.8, Compact: 2.1}
  safety_z: 1.3
  min_presentation_stock: 2
  forecast_error_sigma: 0.18      # replenishment forecast error (drives natural stock-outs)
  supplier_fill_rate_mean: 0.97
  supplier_fill_rate_sd: 0.02
  substitution_rate: 0.25         # share of stocked-out lines where customer buys a substitute
  shrinkage_prob: 0.015           # prob. of losing 1 unit per store-SKU-week (damage, theft)

returns:
  base_return_prob:               # probability a sold line is returned
    Home & Kitchen: 0.035
    Electronics & Tech: 0.050
    Health & Beauty: 0.010
    Toys & Games: 0.030
    Garden & Outdoor: 0.025
    Stationery & Crafts: 0.008
    Seasonal & Gifts: 0.020
  christmas_gift_uplift: 1.8      # lines sold 15 Nov to 24 Dec
  lag_gamma_shape: 1.4
  lag_gamma_scale: 6.0
  policy_days: 30
  christmas_extended_until: "01-31"   # Christmas purchases returnable until 31 Jan
  full_quantity_prob: 0.85
  other_store_prob: 0.06          # returned to a different store in the same region
  no_receipt_prob: 0.03           # legitimate no-receipt returns (store credit)
  reasons: [Changed mind, Faulty, Not as described, Damaged, Gift return]
  reason_probs: [0.42, 0.22, 0.14, 0.10, 0.12]
  restockable_reasons: [Changed mind, Not as described, Gift return]

targets:
  plan_growth: {2024: 0.020, 2025: 0.030}
  store_plan_error_sigma: 0.03
  week_phasing_error_sigma: 0.05
  set_dates: {2024: "2023-11-20", 2025: "2024-11-18"}

data_quality_issues:
  # Rates are per row of the affected table unless stated.  Kept small and
  # realistic: a real POS extract is mostly clean with a long tail of problems.
  fact_sales:
    duplicate_transaction_rate: 0.0015      # whole receipts re-sent by the till
    missing_product_id_rate: 0.0008
    missing_store_id_rate: 0.0005
    invalid_store_id_rate: 0.0001
    invalid_product_id_rate: 0.0002
    null_unit_price_rate: 0.0003
    null_discount_rate: 0.0010
    price_x100_rate: 0.0001                 # cents keyed as euros
    zero_price_rate: 0.0001
    negative_price_rate: 0.00005
    negative_quantity_rate: 0.0004
    malformed_date_rate: 0.0001
    out_of_range_date_rate: 0.00005
    extreme_quantity_rate: 0.00003
    revenue_mismatch_rate: 0.0004
    inconsistent_category_rate: 0.015       # legacy till category labels
    legacy_date_format_store: S19           # this store's till exported DD/MM/YYYY ...
    legacy_date_format_until: "2024-02-29"  # ... until a till upgrade
    orphan_promotion_id_rate: 0.0002
  dim_product:
    duplicate_product_records: 10
    inconsistent_category_records: 14
    missing_supplier_records: 5
    negative_cost_records: 1
  dim_store:
    whitespace_name_records: 1
    inconsistent_region_records: 1
  fact_inventory:
    negative_stock_rate: 0.0002
    broken_flow_rate: 0.0010                # opening stock != previous closing stock
    duplicate_snapshot_rate: 0.0002
    missing_snapshot_rate: 0.0005
    null_received_rate: 0.0003
  fact_returns:
    invalid_transaction_ref_rate: 0.004
    qty_exceeds_sold_rate: 0.002
    return_before_sale_rate: 0.001
    duplicate_return_rate: 0.002
  fact_promotions:
    end_before_start_records: 2
    duplicate_rows: 4
    unknown_product_records: 3
  fact_targets:
    duplicate_rows: 2
    missing_rows: 3
    x100_rows: 1
  missing_batches:                          # store-days never delivered (POS outage)
    - {store_id: S13, date: "2024-10-15"}
    - {store_id: S13, date: "2024-10-16"}

